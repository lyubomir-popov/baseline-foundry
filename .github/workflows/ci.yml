name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  release-check:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npx playwright install chromium
      - run: npm run release:check
