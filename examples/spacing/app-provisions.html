<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Spacing Example: App Provisions</title>
  <link id="example-tier-stylesheet" rel="stylesheet" href="../../dist/tiers/app/styles.css">
  <link rel="stylesheet" href="../../demo/page-chrome.css">
  <link rel="stylesheet" href="./spacing-examples.css">
</head>
<body class="bf-theme bf-tier-app" data-bf-tone="light">
  <script src="../../demo/example-page-init.js"></script>
  <main class="example-grid-target bf-stack bf-section" data-example-grid-target>
    <section class="bf-fixed-width bf-stack bf-section is-shallow bf-prose">
      <h1>App provisions</h1>
      <p>The header and status bars use structural inline alignment while nested stacks own their block rhythm. Horizontal and vertical gaps remain explicit component-layout relationships.</p>
    </section>

    <section class="bf-fixed-width bf-stack bf-section is-shallow">
      <div class="bf-card bf-cluster spacing-header-bar u-baseline-grid">
        <strong>Machines</strong>
        <span class="spacing-note">Ready 24</span>
        <button class="bf-button is-base">Refresh</button>
      </div>

      <div class="bf-cluster spacing-status-bar">
        <span>●</span>
        <span>Commissioning queue</span>
        <span class="spacing-note">Updated 09:52</span>
      </div>
    </section>
  </main>
  <script type="module" src="../../demo/example-page.js"></script>
</body>
</html>
