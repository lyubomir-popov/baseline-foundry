<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Spacing Example: App Provisions</title>
  <link id="example-tier-stylesheet" rel="stylesheet" href="../../dist/tiers/app/styles.css">
  <link rel="stylesheet" href="../../demo/page-chrome.css">
  <link rel="stylesheet" href="./spacing-examples.css">
</head>
<body class="bf-theme bf-tier-app" data-bf-tone="light">
  <main class="example-grid-target">
    <section class="spacing-fixed-width spacing-hero bf-prose">
      <h1>App provisions</h1>
      <p>The header bar keeps its children aligned to the same baseline rhythm, while the status bar proves that the row itself owns spacing and the inline children carry zero margins.</p>
    </section>

    <section class="spacing-fixed-width spacing-stack">
      <div class="spacing-header-bar spacing-baseline-overlay">
        <strong>Machines</strong>
        <span class="spacing-note">Ready 24</span>
        <button class="bf-button is-base is-dense">Refresh</button>
      </div>

      <div class="spacing-status-bar">
        <span>●</span>
        <span>Commissioning queue</span>
        <span class="spacing-note">Updated 09:52</span>
      </div>
    </section>
  </main>
  <script type="module" src="../../demo/example-page.js"></script>
</body>
</html>
