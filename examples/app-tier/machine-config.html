<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>App Tier – Machine Configuration (MAAS)</title>
  <link rel="stylesheet" href="dist/styles.css">
  <link rel="stylesheet" href="app-tier.css">
  <style>
    body {
      margin: 0;
      background: var(--bf-color-bg);
      color: var(--bf-color-text);
    }
  </style>
</head>
<body class="bf-theme bf-tier-app">

  <div class="bf-fixed-width">
    <!-- Page header -->
    <div class="bf-section">
      <h1>Add machine</h1>
    </div>

    <!-- ========================================
         Section: Machine details
         ======================================== -->
    <div class="bf-grid" style="margin-block-end: 2rem;">
      <div class="bf-span-2">
        <h2 class="bf-h2" style="border: none; padding: 0; margin: 0;">Machine details</h2>
      </div>

      <div class="bf-span-4">
        <div class="bf-stack">
          <div class="bf-field">
            <label class="bf-form-label" for="machine-name">Machine name</label>
            <div class="bf-control">
              <input type="text" id="machine-name" class="bf-input" placeholder="e.g. web-server-01">
            </div>
          </div>

          <div class="bf-field">
            <label class="bf-form-label" for="domain">Domain</label>
            <div class="bf-control">
              <select id="domain" class="bf-input">
                <option>maas.internal</option>
                <option>production.local</option>
              </select>
            </div>
          </div>

          <div class="bf-field">
            <label class="bf-form-label" for="zone">Availability zone</label>
            <div class="bf-control">
              <select id="zone" class="bf-input">
                <option>default</option>
                <option>az-1</option>
                <option>az-2</option>
              </select>
            </div>
          </div>

          <div class="bf-field">
            <label class="bf-form-label" for="pool">Resource pool</label>
            <div class="bf-control">
              <select id="pool" class="bf-input">
                <option>default</option>
                <option>production</option>
                <option>staging</option>
              </select>
            </div>
          </div>

          <div class="bf-field">
            <label class="bf-form-label" for="arch">Architecture</label>
            <div class="bf-control">
              <select id="arch" class="bf-input">
                <option>amd64/generic</option>
                <option>arm64/generic</option>
                <option>ppc64el/generic</option>
              </select>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- ========================================
         Section: Power configuration
         ======================================== -->
    <div class="bf-grid" style="margin-block-end: 2rem;">
      <div class="bf-span-2">
        <h2 class="bf-h2" style="border: none; padding: 0; margin: 0;">Power configuration</h2>
        <p style="font-size: 0.75rem; color: var(--bf-color-muted);">
          Configure the BMC / power controller for this machine.
        </p>
      </div>

      <div class="bf-span-4">
        <div class="bf-stack">
          <div class="bf-field">
            <label class="bf-form-label" for="power-type">Power type</label>
            <div class="bf-control">
              <select id="power-type" class="bf-input">
                <option>IPMI</option>
                <option>Virsh</option>
                <option>LXD</option>
                <option>Manual</option>
                <option>Redfish</option>
              </select>
            </div>
          </div>

          <div class="bf-field">
            <label class="bf-form-label" for="power-address">Power address</label>
            <div class="bf-control">
              <input type="text" id="power-address" class="bf-input" placeholder="e.g. 192.168.1.100">
            </div>
          </div>

          <div class="bf-field">
            <label class="bf-form-label" for="power-user">Power user</label>
            <div class="bf-control">
              <input type="text" id="power-user" class="bf-input" placeholder="admin">
            </div>
          </div>

          <div class="bf-field">
            <label class="bf-form-label" for="power-pass">Power password</label>
            <div class="bf-control">
              <input type="password" id="power-pass" class="bf-input">
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- ========================================
         Section: Network
         Two-column field pairs on an inner grid
         ======================================== -->
    <div class="bf-grid" style="margin-block-end: 2rem;">
      <div class="bf-span-2">
        <h2 class="bf-h2" style="border: none; padding: 0; margin: 0;">Network interfaces</h2>
        <p style="font-size: 0.75rem; color: var(--bf-color-muted);">
          Configure the primary network interface.
        </p>
      </div>

      <div class="bf-span-4">
        <div class="bf-stack">
          <!-- Inner two-column layout for related short fields -->
          <div class="bf-grid" style="--bf-grid-columns: 4; gap: 1rem;">
            <div class="bf-span-2">
              <div class="bf-field">
                <label class="bf-form-label" for="mac-address">MAC address</label>
                <div class="bf-control">
                  <input type="text" id="mac-address" class="bf-input" placeholder="aa:bb:cc:dd:ee:ff">
                </div>
              </div>
            </div>
            <div class="bf-span-2">
              <div class="bf-field">
                <label class="bf-form-label" for="ip-mode">IP assignment</label>
                <div class="bf-control">
                  <select id="ip-mode" class="bf-input">
                    <option>Auto assign</option>
                    <option>Static assign</option>
                    <option>DHCP</option>
                    <option>Unconfigured</option>
                  </select>
                </div>
              </div>
            </div>
          </div>

          <div class="bf-field">
            <label class="bf-form-label" for="subnet">Subnet</label>
            <div class="bf-control">
              <select id="subnet" class="bf-input">
                <option>10.0.0.0/24 (fabric-0)</option>
                <option>192.168.1.0/24 (fabric-1)</option>
              </select>
            </div>
          </div>

          <div class="bf-field">
            <label class="bf-form-label" for="notes">Notes</label>
            <div class="bf-control">
              <textarea id="notes" class="bf-input" placeholder="Optional notes about this machine…"></textarea>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Save actions -->
    <div class="bf-grid" style="margin-block-end: 2rem;">
      <div class="bf-span-2"></div>
      <div class="bf-span-4">
        <div class="bf-actions">
          <button class="bf-button">Save machine</button>
          <button class="bf-button is-base">Cancel</button>
        </div>
      </div>
    </div>
  </div>

</body>
</html>
