<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Segmented Control Demo</title>
  <link rel="stylesheet" href="../../dist/presets/panel/styles.css?v=20260328-panel-refresh-5">
  <link rel="stylesheet" href="../component-shell.css?v=20260328-panel-refresh-5">
</head>
<body>
  <main class="component-demo-page component-demo-page--panel vr-theme" data-bf-tone="dark">
    <header class="component-demo-header">
      <div>
        <h5 class="bf-h5 component-demo-kicker">Segmented Control</h5>
        <h1>Dense segmented buttons</h1>
        <p class="component-demo-meta">Segmented controls keep the compact button rhythm while allowing the active state to sit inside the same token model.</p>
      </div>
      <div class="component-demo-toolbar">
        <label class="component-demo-toggle" for="baseline-grid-toggle">
          <input id="baseline-grid-toggle" class="js-baseline-toggle" type="checkbox" aria-controls="component-grid-target">
          Show baseline grid
        </label>
      </div>
    </header>

    <section class="component-demo-stage component-demo-stack" id="component-grid-target" data-component-capture>
      <section class="component-demo-surface component-demo-flow-box" data-baseline-check="box" data-baseline-label="segmented section">
        <div class="p-segmented-control is-dense" data-baseline-check="box" data-baseline-label="segmented control">
          <ul class="p-segmented-control__list" data-baseline-ignore="true">
            <li class="p-segmented-control__item" data-baseline-ignore="true"><button class="p-segmented-control__button is-active" type="button" aria-pressed="true" data-baseline-check="box" data-baseline-label="segmented button 1">Frame</button></li>
            <li class="p-segmented-control__item" data-baseline-ignore="true"><button class="p-segmented-control__button" type="button" aria-pressed="false" data-baseline-check="box" data-baseline-label="segmented button 2">Text</button></li>
            <li class="p-segmented-control__item" data-baseline-ignore="true"><button class="p-segmented-control__button" type="button" aria-pressed="false" data-baseline-check="box" data-baseline-label="segmented button 3">Export</button></li>
          </ul>
        </div>
      </section>
    </section>
  </main>

  <script type="module" src="../component-demo.js?v=20260328-panel-refresh-5"></script>
</body>
</html>
