<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Segmented Control Demo</title>
  <link rel="stylesheet" href="../../dist/presets/panel/styles.css">
  <link rel="stylesheet" href="../component-shell.css">
</head>
<body class="bf-theme is-dark" data-component-capture>
<section class="bf-stack" data-baseline-check="box" data-baseline-label="segmented section">
 <div class="bf-segmented-control" data-baseline-check="box" data-baseline-label="segmented control">
 <ul class="bf-segmented-control-list" data-baseline-ignore="true">
 <li class="bf-segmented-control-item" data-baseline-ignore="true"><button class="bf-segmented-control-button is-active" type="button" aria-pressed="true" data-baseline-check="box" data-baseline-label="segmented button 1">Frame</button></li>
 <li class="bf-segmented-control-item" data-baseline-ignore="true"><button class="bf-segmented-control-button" type="button" aria-pressed="false" data-baseline-check="box" data-baseline-label="segmented button 2">Text</button></li>
 <li class="bf-segmented-control-item" data-baseline-ignore="true"><button class="bf-segmented-control-button" type="button" aria-pressed="false" data-baseline-check="box" data-baseline-label="segmented button 3">Export</button></li>
 </ul>
 </div>
 </section>
  <script type="module" src="../component-demo.js"></script>
</body>
</html>
