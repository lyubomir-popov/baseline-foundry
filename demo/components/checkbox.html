<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Checkbox Demo</title>
  <link rel="stylesheet" href="../../dist/presets/panel/styles.css?v=20260328-panel-refresh-17">
  <link rel="stylesheet" href="../component-shell.css?v=20260328-panel-refresh-17">
</head>
<body>
  <main class="component-demo-page component-demo-page--panel vr-theme" data-bf-tone="dark">
    <header class="component-demo-header">
      <div>
        <h5 class="bf-h5 component-demo-kicker">Checkbox</h5>
        <h1>Dense checkbox</h1>
        <p class="component-demo-meta">Checkbox glyph size now comes from the dedicated visual control token, while the field/control row keeps the dense rhythm without downstream spacing overrides.</p>
      </div>
      <div class="component-demo-toolbar">
        <label class="component-demo-toggle" for="baseline-grid-toggle">
          <input id="baseline-grid-toggle" class="js-baseline-toggle" type="checkbox" aria-controls="component-grid-target">
          Show baseline grid
        </label>
      </div>
    </header>

    <section class="component-demo-stage component-demo-stack" id="component-grid-target" data-component-capture>
      <section class="component-demo-surface component-demo-flow-box" data-baseline-check="box" data-baseline-label="checkbox section">
        <div class="p-form__group p-form__group--checkbox" data-baseline-check="box" data-baseline-label="checkbox field">
          <div class="p-form__control" data-baseline-check="box" data-baseline-label="checkbox control">
            <div class="p-checkbox" data-baseline-check="box" data-baseline-label="checkbox component">
              <input id="checkbox-demo" class="p-checkbox__input" type="checkbox" checked data-baseline-ignore="true">
              <label class="p-checkbox__label" for="checkbox-demo" data-baseline-check="flow" data-baseline-label="checkbox label">Show safe area guides</label>
            </div>
          </div>
        </div>
      </section>
    </section>
  </main>

  <script type="module" src="../component-demo.js?v=20260328-panel-refresh-17"></script>
</body>
</html>
