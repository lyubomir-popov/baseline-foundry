<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Checkbox Demo</title>
  <link rel="stylesheet" href="../../dist/presets/panel/styles.css">
  <link rel="stylesheet" href="../component-shell.css">
</head>
<body class="bf-theme" data-bf-tone="dark" data-component-capture>
<section class="bf-stack" data-baseline-check="box" data-baseline-label="checkbox section">
 <div class="bf-field bf-field is-checkbox" data-baseline-check="box" data-baseline-label="checkbox field">
 <div class="bf-control" data-baseline-check="box" data-baseline-label="checkbox control">
 <div class="bf-checkbox" data-baseline-check="box" data-baseline-label="checkbox component">
 <input id="checkbox-demo" class="bf-checkbox-input" type="checkbox" checked data-baseline-ignore="true">
 <label class="bf-checkbox-label" for="checkbox-demo" data-baseline-check="flow" data-baseline-label="checkbox label">Show safe area guides</label>
 </div>
 </div>
 </div>
 </section>
  <script type="module" src="../component-demo.js"></script>
</body>
</html>
