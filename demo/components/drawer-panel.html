<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Drawer Panel Demo</title>
  <link rel="stylesheet" href="../../dist/presets/panel/styles.css">
  <link rel="stylesheet" href="../component-shell.css">
</head>
<body class="bf-theme is-dark">
  <button class="bf-panel-toggle" type="button" data-panel-drawer-toggle aria-controls="drawer-panel-demo" aria-expanded="true" data-baseline-ignore="true" style="position:relative;z-index:1002;margin-inline-start:14rem">Toggle drawer</button>
  <div class="l-application is-drawer-expanded" data-component-capture style="min-block-size:calc(var(--bf-baseline)*72)">
<main class="l-main" data-baseline-ignore="true">
 <div class="bf-fixed-width" data-baseline-ignore="true">
 <div data-baseline-ignore="true">
 <section data-baseline-ignore="true">
 <h5 class="bf-h5">Stage</h5>
 <p class="bf-body">The working surface keeps its full width. The drawer comes over the top when you need temporary settings or export controls.</p>
 </section>
 </div>
 </div>
 </main>

 <div class="l-application__overlay" data-panel-drawer-close aria-controls="drawer-panel-demo" aria-hidden="false" data-baseline-ignore="true"></div>

 <aside id="drawer-panel-demo" class="l-aside is-overlay is-open" aria-hidden="false" aria-label="Temporary inspector drawer">
 <section class="bf-panel is-fill" data-baseline-check="box" data-baseline-label="drawer panel shell">
 <div class="bf-panel-header is-sticky">
 <h2 class="bf-panel-title" data-baseline-check="flow" data-baseline-label="drawer panel title">Quick settings</h2>
 <div class="bf-panel-controls" data-baseline-check="box" data-baseline-label="drawer panel controls">
 <button class="bf-panel-toggle" type="button" data-panel-drawer-close data-panel-drawer-autofocus aria-controls="drawer-panel-demo" data-baseline-check="box" data-baseline-label="drawer panel close toggle">Close</button>
 </div>
 </div>

 <div class="bf-panel-content">
 <h5 class="bf-h5" data-baseline-check="flow" data-baseline-label="drawer panel kicker">Overlay mode</h5>
 <p class="bf-body" data-baseline-check="flow" data-baseline-label="drawer panel intro">Use the drawer when settings should be close at hand but should not permanently steal width from the stage.</p>

 <div class="bf-field" data-baseline-check="box" data-baseline-label="drawer text field">
 <label class="bf-form-label" for="drawer-name" data-baseline-check="flow" data-baseline-label="drawer text label">Preset name</label>
 <div class="bf-control" data-baseline-check="box" data-baseline-label="drawer text control">
 <input id="drawer-name" class="bf-input is-dense" type="text" value="Studio export" data-baseline-check="box" data-baseline-label="drawer text input">
 </div>
 </div>

 <div class="bf-field" data-baseline-check="box" data-baseline-label="drawer select field">
 <label class="bf-form-label" for="drawer-output" data-baseline-check="flow" data-baseline-label="drawer select label">Output profile</label>
 <div class="bf-control" data-baseline-check="box" data-baseline-label="drawer select control">
 <select id="drawer-output" class="bf-input is-dense" data-baseline-check="box" data-baseline-label="drawer select">
 <option selected>Landscape 1280x720</option>
 <option>Portrait 1080x1920</option>
 <option>Square 1080x1080</option>
 </select>
 </div>
 </div>

 <div class="bf-field bf-field is-checkbox" data-baseline-check="box" data-baseline-label="drawer checkbox field">
 <div class="bf-control" data-baseline-check="box" data-baseline-label="drawer checkbox control">
 <div class="bf-checkbox" data-baseline-check="box" data-baseline-label="drawer checkbox">
 <input id="drawer-grid" class="bf-checkbox-input" type="checkbox" checked data-baseline-ignore="true">
 <label class="bf-checkbox-label" for="drawer-grid" data-baseline-check="flow" data-baseline-label="drawer checkbox label">Show safe area guides</label>
 </div>
 </div>
 </div>

 <div class="bf-actions" data-baseline-check="box" data-baseline-label="drawer action row">
 <button class="bf-button is-base is-dense" type="button" data-baseline-check="box" data-baseline-label="drawer secondary action">Cancel</button>
 <button class="bf-button is-dense" type="button" data-baseline-check="box" data-baseline-label="drawer primary action">Apply</button>
 </div>
 </div>
 </section>
 </aside>
  </div>
  <script type="module" src="../component-demo.js"></script>
</body>
</html>
