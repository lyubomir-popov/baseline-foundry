<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Status Label Demo</title>
  <link rel="stylesheet" href="../../dist/presets/panel/styles.css?v=20260328-panel-refresh-10">
  <link rel="stylesheet" href="../component-shell.css?v=20260328-panel-refresh-10">
</head>
<body>
  <main class="component-demo-page component-demo-page--panel vr-theme" data-bf-tone="dark">
    <header class="component-demo-header">
      <div>
        <h5 class="bf-h5 component-demo-kicker">Status Label</h5>
        <h1>Compact status labels</h1>
        <p class="component-demo-meta">Status labels now read as true uppercase micro labels in the compact panel theme.</p>
      </div>
      <div class="component-demo-toolbar">
        <label class="component-demo-toggle" for="baseline-grid-toggle">
          <input id="baseline-grid-toggle" class="js-baseline-toggle" type="checkbox" aria-controls="component-grid-target">
          Show baseline grid
        </label>
      </div>
    </header>

    <section class="component-demo-stage component-demo-stack" id="component-grid-target" data-component-capture>
      <section class="component-demo-surface component-demo-flow-box" data-baseline-check="box" data-baseline-label="status label section">
        <div class="component-demo-cluster" data-baseline-check="box" data-baseline-label="status label row">
          <span class="p-status-label" data-baseline-check="box" data-baseline-label="status label default">Draft</span>
          <span class="p-status-label--positive" data-baseline-check="box" data-baseline-label="status label positive">Saved</span>
          <span class="p-status-label--caution" data-baseline-check="box" data-baseline-label="status label caution">Review</span>
          <span class="p-status-label--information" data-baseline-check="box" data-baseline-label="status label info">Linked</span>
          <span class="p-status-label--negative" data-baseline-check="box" data-baseline-label="status label negative">Error</span>
        </div>
      </section>
    </section>
  </main>

  <script type="module" src="../component-demo.js?v=20260328-panel-refresh-10"></script>
</body>
</html>
