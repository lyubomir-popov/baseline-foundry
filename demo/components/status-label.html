<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Status Label Demo</title>
  <link rel="stylesheet" href="../../dist/tiers/editorial/styles.css">
  <link rel="stylesheet" href="../component-shell.css">
</head>
<body class="bf-theme is-dark" data-component-capture>
<section class="bf-stack" data-baseline-check="box" data-baseline-ignore="true" data-baseline-label="status label section">
 <div class="bf-cluster" data-baseline-check="box" data-baseline-ignore="true" data-baseline-label="status label row">
 <span class="bf-status-label" data-baseline-check="box" data-baseline-ignore="true" data-baseline-label="status label default">Draft</span>
 <span class="bf-status-label is-positive" data-baseline-check="box" data-baseline-ignore="true" data-baseline-label="status label positive">Saved</span>
 <span class="bf-status-label is-caution" data-baseline-check="box" data-baseline-ignore="true" data-baseline-label="status label caution">Review</span>
 <span class="bf-status-label is-information" data-baseline-check="box" data-baseline-ignore="true" data-baseline-label="status label info">Linked</span>
 <span class="bf-status-label is-negative" data-baseline-check="box" data-baseline-ignore="true" data-baseline-label="status label negative">Error</span>
 </div>
 </section>
  <script type="module" src="../component-demo.js"></script>
</body>
</html>
