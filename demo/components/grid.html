<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Grid Demo</title>
  <link rel="stylesheet" href="../../dist/tiers/editorial/styles.css">
  <link rel="stylesheet" href="../component-shell.css">
</head>
<body class="bf-theme is-dark" data-component-capture>
<div class="bf-grid">
 <div class="bf-span-4" data-baseline-check="box" data-baseline-label="grid card span 4A">
 <h5 class="bf-h5" data-baseline-check="flow" data-baseline-label="grid kicker 4A">Span 4</h5>
 <p class="bf-body" data-baseline-check="flow" data-baseline-label="grid body 4A">Quarter-width at the widest container.</p>
 </div>
 <div class="bf-span-8" data-baseline-check="box" data-baseline-label="grid card span 8">
 <h5 class="bf-h5" data-baseline-check="flow" data-baseline-label="grid kicker 8">Span 8</h5>
 <p class="bf-body" data-baseline-check="flow" data-baseline-label="grid body 8">Primary half-width module.</p>
 </div>
 <div class="bf-span-4" data-baseline-check="box" data-baseline-label="grid card span 4B">
 <h5 class="bf-h5" data-baseline-check="flow" data-baseline-label="grid kicker 4B">Span 4</h5>
 <p class="bf-body" data-baseline-check="flow" data-baseline-label="grid body 4B">Companion panel aligned to the same keylines.</p>
 </div>
 <div class="bf-span-2" data-baseline-check="box" data-baseline-label="grid card span 2A">
 <h5 class="bf-h5" data-baseline-check="flow" data-baseline-label="grid kicker 2A">Span 2</h5>
 <p class="bf-body" data-baseline-check="flow" data-baseline-label="grid body 2A">Narrow metadata cell.</p>
 </div>
 <div class="bf-span-2" data-baseline-check="box" data-baseline-label="grid card span 2B">
 <h5 class="bf-h5" data-baseline-check="flow" data-baseline-label="grid kicker 2B">Span 2</h5>
 <p class="bf-body" data-baseline-check="flow" data-baseline-label="grid body 2B">Second narrow utility cell.</p>
 </div>
 <div class="bf-span-4" data-baseline-check="box" data-baseline-label="grid card span 4C">
 <h5 class="bf-h5" data-baseline-check="flow" data-baseline-label="grid kicker 4C">Span 4</h5>
 <p class="bf-body" data-baseline-check="flow" data-baseline-label="grid body 4C">A medium block that avoids arbitrary thirds.</p>
 </div>
 </div>
  <script type="module" src="../component-demo.js"></script>
</body>
</html>
