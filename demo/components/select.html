<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Select Demo</title>
  <link rel="stylesheet" href="../../dist/presets/panel/styles.css?v=20260329-panel-refresh-19">
  <link rel="stylesheet" href="../component-shell.css?v=20260329-panel-refresh-19">
</head>
<body>
  <main class="component-demo-page component-demo-page--panel vr-theme" data-bf-tone="dark">
    <header class="component-demo-header">
      <div>
        <h5 class="bf-h5 component-demo-kicker">Select</h5>
        <h1>Dense select field</h1>
        <p class="component-demo-meta">Select styling shares the same bottom-border treatment, height, and inline padding model as the text inputs.</p>
      </div>
      <div class="component-demo-toolbar">
        <label class="component-demo-toggle" for="baseline-grid-toggle">
          <input id="baseline-grid-toggle" class="js-baseline-toggle" type="checkbox" aria-controls="component-grid-target">
          Show baseline grid
        </label>
      </div>
    </header>

    <section class="component-demo-stage component-demo-stack" id="component-grid-target" data-component-capture>
      <section class="component-demo-surface component-demo-flow-box" data-baseline-check="box" data-baseline-label="select section">
        <div class="bf-field" data-baseline-check="box" data-baseline-label="select field">
          <label class="bf-form-label" for="select-demo" data-baseline-check="flow" data-baseline-label="select label">Output profile</label>
          <div class="bf-control" data-baseline-check="box" data-baseline-label="select control">
            <select id="select-demo" data-baseline-check="box" data-baseline-label="select input">
              <option>Landscape 1280x720</option>
              <option>Square 1080x1080</option>
              <option>Portrait 1080x1920</option>
            </select>
          </div>
          <p class="bf-form-help" data-baseline-check="flow" data-baseline-label="select help">The chevron and control padding stay within the same dense block size.</p>
        </div>
      </section>
    </section>
  </main>

  <script type="module" src="../component-demo.js?v=20260329-panel-refresh-19"></script>
</body>
</html>
