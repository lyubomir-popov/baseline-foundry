<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Actions Demo</title>
  <link rel="stylesheet" href="../../dist/tiers/editorial/styles.css">
  <link rel="stylesheet" href="../component-shell.css">
</head>
<body class="bf-theme is-dark" data-component-capture>
<section class="bf-stack" data-baseline-check="box" data-baseline-label="actions section">
 <h5 class="bf-h5" data-baseline-check="flow" data-baseline-label="actions kicker">Canonical row</h5>
 <div class="bf-actions" data-baseline-check="box" data-baseline-label="actions row">
 <button class="bf-button is-base" type="button" data-baseline-check="box" data-baseline-label="actions secondary">Cancel</button>
 <button class="bf-button" type="button" data-baseline-check="box" data-baseline-label="actions primary">Apply</button>
 </div>
 </section>

 <section class="bf-stack" data-baseline-check="box" data-baseline-label="actions wrapping target section">
 <h5 class="bf-h5" data-baseline-check="flow" data-baseline-label="actions wrapping target kicker">Wrapping icon targets</h5>
 <div class="bf-stack is-dense">
 <h6 class="bf-h6" data-baseline-check="flow" data-baseline-label="actions wrapping action label">Action row</h6>
 <div class="bf-actions" style="inline-size:1.5rem" data-icon-target-wrap-specimen="actions" data-baseline-check="box" data-baseline-label="actions wrapping icon target row">
 <button class="bf-button is-link is-icon" type="button" aria-label="Previous" data-baseline-check="box" data-baseline-label="actions wrapping previous target"><span class="bf-icon is-chevron-left" aria-hidden="true"></span></button>
 <button class="bf-button is-link is-icon" type="button" aria-label="Next" data-baseline-check="box" data-baseline-label="actions wrapping next target"><span class="bf-icon is-chevron-right" aria-hidden="true"></span></button>
 </div>
 </div>
 <div class="bf-stack is-dense">
 <h6 class="bf-h6" data-baseline-check="flow" data-baseline-label="actions wrapping cluster label">Cluster row</h6>
 <div class="bf-cluster is-dense" style="inline-size:1.5rem" data-icon-target-wrap-specimen="cluster" data-baseline-check="box" data-baseline-label="cluster wrapping icon target row">
 <button class="bf-button is-link is-icon" type="button" aria-label="Previous" data-baseline-check="box" data-baseline-label="cluster wrapping previous target"><span class="bf-icon is-chevron-left" aria-hidden="true"></span></button>
 <button class="bf-button is-link is-icon" type="button" aria-label="Next" data-baseline-check="box" data-baseline-label="cluster wrapping next target"><span class="bf-icon is-chevron-right" aria-hidden="true"></span></button>
 </div>
 </div>
 </section>

 <section class="bf-stack" data-baseline-check="box" data-baseline-label="actions nowrap section">
 <h5 class="bf-h5" data-baseline-check="flow" data-baseline-label="actions nowrap kicker">Scrollable strip</h5>
 <div class="bf-actions is-nowrap" data-baseline-check="box" data-baseline-label="actions nowrap row">
 <button class="bf-button is-base" type="button" data-baseline-check="box" data-baseline-label="actions export png">PNG</button>
 <button class="bf-button is-base" type="button" data-baseline-check="box" data-baseline-label="actions export svg">SVG</button>
 <button class="bf-button is-base" type="button" data-baseline-check="box" data-baseline-label="actions export gif">GIF</button>
 <button class="bf-button is-base" type="button" data-baseline-check="box" data-baseline-label="actions export mp4">MP4</button>
 <button class="bf-button" type="button" data-baseline-check="box" data-baseline-label="actions export final">Export all</button>
 </div>
 </section>
  <script type="module" src="../component-demo.js"></script>
</body>
</html>
