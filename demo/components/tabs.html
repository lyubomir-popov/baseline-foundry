<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tabs Demo</title>
  <link rel="stylesheet" href="../../dist/presets/panel/styles.css?v=20260328-panel-refresh-5">
  <link rel="stylesheet" href="../component-shell.css?v=20260328-panel-refresh-5">
</head>
<body>
  <main class="component-demo-page component-demo-page--panel vr-theme" data-bf-tone="dark">
    <header class="component-demo-header">
      <div>
        <h5 class="bf-h5 component-demo-kicker">Tabs</h5>
        <h1>Dense tab row</h1>
        <p class="component-demo-meta">Tabs stay at body-scale density while leaving enough room beneath the rule before the panel body starts.</p>
      </div>
      <div class="component-demo-toolbar">
        <label class="component-demo-toggle" for="baseline-grid-toggle">
          <input id="baseline-grid-toggle" class="js-baseline-toggle" type="checkbox" aria-controls="component-grid-target">
          Show baseline grid
        </label>
      </div>
    </header>

    <section class="component-demo-stage component-demo-stack" id="component-grid-target" data-component-capture>
      <section class="component-demo-surface component-demo-flow-box" data-baseline-check="box" data-baseline-label="tabs section">
        <div class="p-tabs" data-baseline-check="box" data-baseline-label="tabs component">
          <ul class="p-tabs__list" role="tablist" data-baseline-ignore="true">
            <li class="p-tabs__item" data-baseline-ignore="true">
              <button class="p-tabs__link" type="button" role="tab" aria-selected="true" aria-controls="tabs-panel-1" tabindex="0" data-baseline-check="box" data-baseline-label="tabs tab 1">Document</button>
            </li>
            <li class="p-tabs__item" data-baseline-ignore="true">
              <button class="p-tabs__link" type="button" role="tab" aria-selected="false" aria-controls="tabs-panel-2" tabindex="-1" data-baseline-check="box" data-baseline-label="tabs tab 2">Export</button>
            </li>
          </ul>
          <div id="tabs-panel-1" class="p-tabs__panel" role="tabpanel" aria-hidden="false">
            <p class="bf-body" data-baseline-check="flow" data-baseline-label="tabs body">Document-scoped controls can sit on the same dense baseline model as the rest of the inspector.</p>
          </div>
          <div id="tabs-panel-2" class="p-tabs__panel" role="tabpanel" aria-hidden="true">
            <p class="bf-body" data-baseline-ignore="true">Hidden export panel.</p>
          </div>
        </div>
      </section>
    </section>
  </main>

  <script type="module" src="../component-demo.js?v=20260328-panel-refresh-5"></script>
</body>
</html>
