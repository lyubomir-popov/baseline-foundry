<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Color Input Demo</title>
  <link rel="stylesheet" href="../../dist/presets/panel/styles.css?v=20260328-panel-refresh-17">
  <link rel="stylesheet" href="../component-shell.css?v=20260328-panel-refresh-17">
</head>
<body>
  <main class="component-demo-page component-demo-page--panel vr-theme" data-bf-tone="dark">
    <header class="component-demo-header">
      <div>
        <h5 class="bf-h5 component-demo-kicker">Color Input</h5>
        <h1>Compact color field sizing</h1>
        <p class="component-demo-meta">The downstream <code>control-color</code> treatment now has a package-side size model and a canonical alias.</p>
      </div>
      <div class="component-demo-toolbar">
        <label class="component-demo-toggle" for="baseline-grid-toggle">
          <input id="baseline-grid-toggle" class="js-baseline-toggle" type="checkbox" aria-controls="component-grid-target">
          Show baseline grid
        </label>
      </div>
    </header>

    <section class="component-demo-stage component-demo-stack" id="component-grid-target" data-component-capture>
      <section class="component-demo-surface component-demo-flow-box" data-baseline-check="box" data-baseline-label="color input section">
        <div class="grid-row" data-baseline-check="box" data-baseline-label="color input row">
          <div class="col-1" data-baseline-ignore="true">
            <div class="p-form__group" data-baseline-check="box" data-baseline-label="color input canonical field">
              <label class="p-form__label u-no-margin--bottom" for="color-input-canonical" data-baseline-check="flow" data-baseline-label="color input canonical label">Primary</label>
              <div class="p-form__control" data-baseline-check="box" data-baseline-label="color input canonical control">
                <input id="color-input-canonical" class="p-color-input" type="color" value="#f6b73c" data-baseline-check="box" data-baseline-label="color input canonical">
              </div>
            </div>
          </div>
          <div class="col-1" data-baseline-ignore="true">
            <div class="p-form__group" data-baseline-check="box" data-baseline-label="color input alias field">
              <label class="p-form__label u-no-margin--bottom" for="color-input-alias" data-baseline-check="flow" data-baseline-label="color input alias label">Accent</label>
              <div class="p-form__control" data-baseline-check="box" data-baseline-label="color input alias control">
                <input id="color-input-alias" class="control-color" type="color" value="#6699cc" data-baseline-check="box" data-baseline-label="color input alias">
              </div>
            </div>
          </div>
        </div>
      </section>
    </section>
  </main>

  <script type="module" src="../component-demo.js?v=20260328-panel-refresh-17"></script>
</body>
</html>
