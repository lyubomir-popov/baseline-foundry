<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Radio Demo</title>
  <link rel="stylesheet" href="../../dist/presets/panel/styles.css?v=20260328-panel-refresh-12">
  <link rel="stylesheet" href="../component-shell.css?v=20260328-panel-refresh-12">
</head>
<body>
  <main class="component-demo-page component-demo-page--panel vr-theme" data-bf-tone="dark">
    <header class="component-demo-header">
      <div>
        <h5 class="bf-h5 component-demo-kicker">Radio</h5>
        <h1>Dense radio option</h1>
        <p class="component-demo-meta">Radio control spacing follows the same dedicated visual glyph token and dense label row as the checkbox.</p>
      </div>
      <div class="component-demo-toolbar">
        <label class="component-demo-toggle" for="baseline-grid-toggle">
          <input id="baseline-grid-toggle" class="js-baseline-toggle" type="checkbox" aria-controls="component-grid-target">
          Show baseline grid
        </label>
      </div>
    </header>

    <section class="component-demo-stage component-demo-stack" id="component-grid-target" data-component-capture>
      <section class="component-demo-surface component-demo-flow-box" data-baseline-check="box" data-baseline-label="radio section">
        <div class="p-form__group p-form__group--radio" data-baseline-check="box" data-baseline-label="radio field">
          <div class="p-form__control" data-baseline-check="box" data-baseline-label="radio control">
            <div class="p-radio" data-baseline-check="box" data-baseline-label="radio component">
              <input id="radio-demo" class="p-radio__input" name="radio-demo-group" type="radio" checked data-baseline-ignore="true">
              <label class="p-radio__label" for="radio-demo" data-baseline-check="flow" data-baseline-label="radio label">Keep linked sizing</label>
            </div>
          </div>
        </div>
      </section>
    </section>
  </main>

  <script type="module" src="../component-demo.js?v=20260328-panel-refresh-12"></script>
</body>
</html>
