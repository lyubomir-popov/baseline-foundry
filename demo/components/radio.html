<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Radio Demo</title>
  <link rel="stylesheet" href="../../dist/presets/panel/styles.css">
  <link rel="stylesheet" href="../component-shell.css">
</head>
<body class="vr-theme" data-bf-tone="dark" data-component-capture>
<section class="bf-stack" data-baseline-check="box" data-baseline-label="radio section">
 <div class="bf-field bf-field is-radio" data-baseline-check="box" data-baseline-label="radio field">
 <div class="bf-control" data-baseline-check="box" data-baseline-label="radio control">
 <div class="bf-radio" data-baseline-check="box" data-baseline-label="radio component">
 <input id="radio-demo" class="bf-radio-input" name="radio-demo-group" type="radio" checked data-baseline-ignore="true">
 <label class="bf-radio-label" for="radio-demo" data-baseline-check="flow" data-baseline-label="radio label">Keep linked sizing</label>
 </div>
 </div>
 </div>
 </section>
  <script type="module" src="../component-demo.js"></script>
</body>
</html>
