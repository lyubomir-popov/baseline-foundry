<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cards Demo</title>
  <link rel="stylesheet" href="../../dist/presets/panel/styles.css">
  <link rel="stylesheet" href="../component-shell.css">
</head>
<body class="bf-theme is-dark" data-component-capture>
<section >
 <article class="bf-card bf-stack" data-baseline-check="box" data-baseline-label="card default">
 <header class="bf-card-header" data-baseline-ignore="true">
 <h5 class="bf-h5" data-baseline-check="flow" data-baseline-label="card kicker 1">Card</h5>
 <p class="bf-h4" data-baseline-check="flow" data-baseline-label="card heading 1">Default surface</p>
 </header>
 <div class="bf-card-content" data-baseline-ignore="true">
 <p class="bf-body" data-baseline-check="flow" data-baseline-label="card body 1">Neutral summary surface for settings, teasers, and basic grouping.</p>
 </div>
 <button class="bf-button is-base is-dense" type="button" data-baseline-check="box" data-baseline-label="card button 1">Inspect</button>
 </article>

 <article class="bf-card is-highlighted bf-stack" data-baseline-check="box" data-baseline-label="card highlighted">
 <header class="bf-card-header" data-baseline-ignore="true">
 <h5 class="bf-h5" data-baseline-check="flow" data-baseline-label="card kicker 2">Highlighted</h5>
 <p class="bf-h4" data-baseline-check="flow" data-baseline-label="card heading 2">Emphasis surface</p>
 </header>
 <div class="bf-card-content" data-baseline-ignore="true">
 <p class="bf-body" data-baseline-check="flow" data-baseline-label="card body 2">Adds weight without leaving the same spacing model.</p>
 </div>
 <button class="bf-button is-dense" type="button" data-baseline-check="box" data-baseline-label="card button 2">Apply</button>
 </article>

 <article class="bf-card is-muted bf-stack" data-baseline-check="box" data-baseline-label="card muted">
 <header class="bf-card-header" data-baseline-ignore="true">
 <h5 class="bf-h5" data-baseline-check="flow" data-baseline-label="card kicker 3">Muted</h5>
 <p class="bf-h4" data-baseline-check="flow" data-baseline-label="card heading 3">Quiet grouping</p>
 </header>
 <div class="bf-card-content" data-baseline-ignore="true">
 <p class="bf-body" data-baseline-check="flow" data-baseline-label="card body 3">Best used for metadata and supporting notes.</p>
 </div>
 <button class="bf-button is-base is-dense" type="button" data-baseline-check="box" data-baseline-label="card button 3">Open</button>
 </article>
 </section>
  <script type="module" src="../component-demo.js"></script>
</body>
</html>
