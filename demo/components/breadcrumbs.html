<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Breadcrumbs Demo</title>
  <link rel="stylesheet" href="../../dist/presets/panel/styles.css?v=20260328-panel-refresh-5">
  <link rel="stylesheet" href="../component-shell.css?v=20260328-panel-refresh-5">
</head>
<body>
  <main class="component-demo-page component-demo-page--panel vr-theme" data-bf-tone="dark">
    <header class="component-demo-header">
      <div>
        <h5 class="bf-h5 component-demo-kicker">Breadcrumbs</h5>
        <h1>Compact breadcrumb trail</h1>
        <p class="component-demo-meta">Breadcrumbs stay lightweight and aligned without needing a second spacing system.</p>
      </div>
      <div class="component-demo-toolbar">
        <label class="component-demo-toggle" for="baseline-grid-toggle">
          <input id="baseline-grid-toggle" class="js-baseline-toggle" type="checkbox" aria-controls="component-grid-target">
          Show baseline grid
        </label>
      </div>
    </header>

    <section class="component-demo-stage component-demo-stack" id="component-grid-target" data-component-capture>
      <section class="component-demo-surface component-demo-flow-box" data-baseline-check="box" data-baseline-label="breadcrumbs section">
        <nav class="p-breadcrumbs" aria-label="Breadcrumb" data-baseline-check="box" data-baseline-label="breadcrumbs component">
          <ol class="p-breadcrumbs__items" data-baseline-check="box" data-baseline-label="breadcrumbs list">
            <li class="p-breadcrumbs__item" data-baseline-check="flow" data-baseline-label="breadcrumbs item 1"><a href="#">Workspace</a></li>
            <li class="p-breadcrumbs__item" data-baseline-check="flow" data-baseline-label="breadcrumbs item 2"><a href="#">Layouts</a></li>
            <li class="p-breadcrumbs__item" data-baseline-check="flow" data-baseline-label="breadcrumbs item 3"><span aria-current="page">Brand Ops</span></li>
          </ol>
        </nav>
      </section>
    </section>
  </main>

  <script type="module" src="../component-demo.js?v=20260328-panel-refresh-5"></script>
</body>
</html>
