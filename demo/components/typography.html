<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Typography Roles Demo</title>
  <link rel="stylesheet" href="../../dist/styles.css">
  <link rel="stylesheet" href="../component-shell.css">
</head>
<body class="bf-theme is-dark" data-component-capture>
 <p data-baseline-check="flow" data-baseline-label="body role">Body text sits at the editorial base size and carries the default paragraph rhythm.</p>
 <h1 data-baseline-check="flow" data-baseline-label="h1 role">Primary headline pair weight</h1>
 <h2 data-baseline-check="flow" data-baseline-label="h2 role">Companion headline at the same size</h2>
 <h3 data-baseline-check="flow" data-baseline-label="h3 role">Secondary structural heading</h3>
 <h4 data-baseline-check="flow" data-baseline-label="h4 role">Secondary companion heading</h4>
 <h5 data-baseline-check="flow" data-baseline-label="h5 role">Uppercase section signal</h5>
 <h6 data-baseline-check="flow" data-baseline-label="h6 role">Bold small heading at the base size</h6> 
 <script type="module" src="../component-demo.js"></script>
</body>
</html>
