<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel Tabs Demo</title>
  <link rel="stylesheet" href="../../dist/presets/panel/styles.css?v=20260329-panel-refresh-19">
  <link rel="stylesheet" href="../component-shell.css?v=20260329-panel-refresh-19">
</head>
<body>
  <main class="component-demo-page component-demo-page--panel vr-theme" data-bf-tone="dark">
    <header class="component-demo-header">
      <div>
        <h5 class="bf-h5 component-demo-kicker">Panel Tabs</h5>
        <h1>Equal-width dense tab rows</h1>
        <p class="component-demo-meta">Equal-width dense tabs are a canonical modifier for panel navigation and view switching.</p>
      </div>
      <div class="component-demo-toolbar">
        <label class="component-demo-toggle" for="baseline-grid-toggle">
          <input id="baseline-grid-toggle" class="js-baseline-toggle" type="checkbox" aria-controls="component-grid-target">
          Show baseline grid
        </label>
      </div>
    </header>

    <section class="component-demo-stage component-demo-stack" id="component-grid-target" data-component-capture>
      <section class="component-demo-surface component-demo-flow-box" data-baseline-check="box" data-baseline-label="equal tabs section">
        <div class="bf-tabs bf-tabs is-equal" data-baseline-check="box" data-baseline-label="equal tabs component">
          <ul class="bf-tabs-list" role="tablist" data-baseline-ignore="true">
            <li class="bf-tabs-item" data-baseline-ignore="true">
              <button class="bf-tabs-link" type="button" role="tab" aria-selected="true" aria-controls="panel-tabs-canonical-1" data-baseline-check="box" data-baseline-label="equal tabs canonical tab 1">Document</button>
            </li>
            <li class="bf-tabs-item" data-baseline-ignore="true">
              <button class="bf-tabs-link" type="button" role="tab" aria-selected="false" aria-controls="panel-tabs-canonical-2" tabindex="-1" data-baseline-check="box" data-baseline-label="equal tabs canonical tab 2">Output</button>
            </li>
            <li class="bf-tabs-item" data-baseline-ignore="true">
              <button class="bf-tabs-link" type="button" role="tab" aria-selected="false" aria-controls="panel-tabs-canonical-3" tabindex="-1" data-baseline-check="box" data-baseline-label="equal tabs canonical tab 3">Export</button>
            </li>
          </ul>
          <div id="panel-tabs-canonical-1" class="bf-tabs-panel" role="tabpanel" aria-hidden="false">
            <p class="bf-body" data-baseline-check="flow" data-baseline-label="equal tabs canonical body">Three dense tabs can share the same row without falling back to local layout CSS.</p>
          </div>
          <div id="panel-tabs-canonical-2" class="bf-tabs-panel" role="tabpanel" aria-hidden="true">
            <p class="bf-body" data-baseline-ignore="true">Hidden output tab.</p>
          </div>
          <div id="panel-tabs-canonical-3" class="bf-tabs-panel" role="tabpanel" aria-hidden="true">
            <p class="bf-body" data-baseline-ignore="true">Hidden export tab.</p>
          </div>
        </div>
      </section>
    </section>
  </main>

  <script type="module" src="../component-demo.js?v=20260329-panel-refresh-19"></script>
</body>
</html>
