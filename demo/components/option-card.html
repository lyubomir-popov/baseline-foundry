<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Option Card Demo</title>
  <link rel="stylesheet" href="../../dist/presets/panel/styles.css?v=20260328-panel-refresh-18">
  <link rel="stylesheet" href="../component-shell.css?v=20260328-panel-refresh-18">
</head>
<body>
  <main class="component-demo-page component-demo-page--panel vr-theme" data-bf-tone="dark">
    <header class="component-demo-header">
      <div>
        <h5 class="bf-h5 component-demo-kicker">Option Card</h5>
        <h1>Dense option and status cards</h1>
        <p class="component-demo-meta">These cards cover both clickable style choices and read-only mapping or status cards.</p>
      </div>
      <div class="component-demo-toolbar">
        <label class="component-demo-toggle" for="baseline-grid-toggle">
          <input id="baseline-grid-toggle" class="js-baseline-toggle" type="checkbox" aria-controls="component-grid-target">
          Show baseline grid
        </label>
      </div>
    </header>

    <section class="component-demo-stage component-demo-stack" id="component-grid-target" data-component-capture>
      <section class="component-demo-surface component-demo-flow-box" data-baseline-check="box" data-baseline-label="option card section">
        <div class="p-option-grid" data-baseline-check="box" data-baseline-label="option card grid">
          <button class="p-option-card is-active" type="button" data-baseline-check="box" data-baseline-label="option card 1">
            <span class="p-option-card__label">Hero Title</span>
            <span class="p-option-card__meta">48px / 56px / 600</span>
          </button>
          <button class="p-option-card" type="button" data-baseline-check="box" data-baseline-label="option card 2">
            <span class="p-option-card__label">Editorial Body</span>
            <span class="p-option-card__meta">16px / 24px / 400</span>
          </button>
          <div class="p-option-card" data-baseline-check="box" data-baseline-label="option card 3">
            <span class="p-option-card__label">CSV Alias Mapping</span>
            <span class="p-option-card__meta">Mapped via CSV alias</span>
            <span class="p-option-card__meta is-quiet">Value: Autumn campaign</span>
          </div>
        </div>
      </section>
    </section>
  </main>

  <script type="module" src="../component-demo.js?v=20260328-panel-refresh-18"></script>
</body>
</html>
