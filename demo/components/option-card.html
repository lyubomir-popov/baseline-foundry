<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Option Card Demo</title>
  <link rel="stylesheet" href="../../dist/presets/panel/styles.css">
  <link rel="stylesheet" href="../component-shell.css">
</head>
<body class="vr-theme" data-bf-tone="dark" data-component-capture>
<section class="bf-stack" data-baseline-check="box" data-baseline-label="option card section">
 <div class="bf-option-grid" data-baseline-check="box" data-baseline-label="option card grid">
 <button class="bf-option-card is-active" type="button" data-baseline-check="box" data-baseline-label="option card 1">
 <span class="bf-option-card-label">Hero Title</span>
 <span class="bf-option-card-meta">48px / 56px / 600</span>
 </button>
 <button class="bf-option-card" type="button" data-baseline-check="box" data-baseline-label="option card 2">
 <span class="bf-option-card-label">Editorial Body</span>
 <span class="bf-option-card-meta">16px / 24px / 400</span>
 </button>
 <div class="bf-option-card" data-baseline-check="box" data-baseline-label="option card 3">
 <span class="bf-option-card-label">CSV Alias Mapping</span>
 <span class="bf-option-card-meta">Mapped via CSV alias</span>
 <span class="bf-option-card-meta is-quiet">Value: Autumn campaign</span>
 </div>
 </div>
 </section>
  <script type="module" src="../component-demo.js"></script>
</body>
</html>
