<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stage Shell Demo</title>
  <link rel="stylesheet" href="../../dist/tiers/editorial/styles.css">
  <link rel="stylesheet" href="../component-shell.css">
</head>
<body class="bf-theme is-dark" data-component-capture>
<div class="bf-stage-shell" data-baseline-ignore="true">
 <div class="bf-fixed-width bf-stack is-flush" data-baseline-ignore="true">
 <section aria-label="Centered preview stage" data-baseline-ignore="true"></section>
 <h5 class="bf-h5" data-baseline-check="flow" data-baseline-label="stage shell label">Centered preview shell</h5>
 <p class="stage-meta" data-baseline-ignore="true">The helper owns centering and vertical rhythm only. Width still comes from <code>bf-fixed-width</code> or the consumer's chosen stage constraint.</p>
 </div>
 </div>
  <script type="module" src="../component-demo.js"></script>
</body>
</html>
