<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Badge Demo</title>
  <link rel="stylesheet" href="../../dist/presets/panel/styles.css?v=20260328-panel-refresh-8">
  <link rel="stylesheet" href="../component-shell.css?v=20260328-panel-refresh-8">
</head>
<body>
  <main class="component-demo-page component-demo-page--panel vr-theme" data-bf-tone="dark">
    <header class="component-demo-header">
      <div>
        <h5 class="bf-h5 component-demo-kicker">Badge</h5>
        <h1>Dense badge tokens</h1>
        <p class="component-demo-meta">Badges sit on the compact scale and can also be embedded inside chips.</p>
      </div>
      <div class="component-demo-toolbar">
        <label class="component-demo-toggle" for="baseline-grid-toggle">
          <input id="baseline-grid-toggle" class="js-baseline-toggle" type="checkbox" aria-controls="component-grid-target">
          Show baseline grid
        </label>
      </div>
    </header>

    <section class="component-demo-stage component-demo-stack" id="component-grid-target" data-component-capture>
      <section class="component-demo-surface component-demo-flow-box" data-baseline-check="box" data-baseline-label="badge section">
        <div class="component-demo-cluster" data-baseline-check="box" data-baseline-label="badge row">
          <span class="p-badge" data-baseline-check="box" data-baseline-label="badge default">3</span>
          <span class="p-badge--negative" data-baseline-check="box" data-baseline-label="badge negative">9</span>
          <button class="p-chip" type="button" data-baseline-check="box" data-baseline-label="badge chip">
            <span class="p-chip__value" data-baseline-check="flow" data-baseline-label="badge chip text">Layers</span>
            <span class="p-badge" data-baseline-check="box" data-baseline-label="badge nested">12</span>
          </button>
        </div>
      </section>
    </section>
  </main>

  <script type="module" src="../component-demo.js?v=20260328-panel-refresh-8"></script>
</body>
</html>
