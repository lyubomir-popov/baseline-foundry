<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Badge Demo</title>
  <link rel="stylesheet" href="../../dist/presets/panel/styles.css">
  <link rel="stylesheet" href="../component-shell.css">
</head>
<body class="bf-theme" data-bf-tone="dark" data-component-capture>
<section class="bf-stack" data-baseline-ignore="true">
 <div data-baseline-check="box" data-baseline-label="badge standalone specimen">
 <div class="bf-cluster" data-baseline-check="box" data-baseline-label="badge standalone row">
 <span class="bf-badge" data-baseline-check="box" data-baseline-label="badge default">3</span>
 <span class="bf-badge is-negative" data-baseline-check="box" data-baseline-label="badge negative">9</span>
 </div>
 </div>

 <div data-baseline-check="box" data-baseline-ignore="true" data-baseline-label="badge nested specimen">
 <div class="bf-cluster" data-baseline-check="box" data-baseline-ignore="true" data-baseline-label="badge nested row">
 <button class="bf-chip" type="button" data-baseline-check="box" data-baseline-ignore="true" data-baseline-label="badge chip">
 <span class="bf-chip-value" data-baseline-ignore="true">Layers</span>
 <span class="bf-badge" data-baseline-check="box" data-baseline-ignore="true" data-baseline-label="badge nested">12</span>
 </button>
 </div>
 </div>
 </section>
  <script type="module" src="../component-demo.js"></script>
</body>
</html>
