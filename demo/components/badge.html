<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Badge Demo</title>
  <link rel="stylesheet" href="../../dist/tiers/editorial/styles.css">
  <link rel="stylesheet" href="../component-shell.css">
</head>
<body class="bf-theme is-dark" data-component-capture>
<section class="bf-stack" data-baseline-ignore="true">
 <div data-baseline-check="box" data-baseline-label="badge standalone specimen">
 <div class="bf-cluster" data-baseline-check="box" data-baseline-label="badge standalone row">
 <span class="bf-badge" data-block-derived-badge="1" data-baseline-check="box" data-baseline-label="badge default">3</span>
 <span class="bf-badge is-negative" data-block-derived-badge="2" data-baseline-check="box" data-baseline-label="badge negative">12</span>
 <span class="bf-badge" data-block-derived-badge="3" data-baseline-check="box" data-baseline-label="badge three characters">123</span>
 <span class="bf-badge" data-block-derived-badge="4" data-baseline-check="box" data-baseline-label="badge four characters">1234</span>
 <span class="bf-badge" data-block-derived-badge="5" data-baseline-check="box" data-baseline-label="badge five characters">12345</span>
 </div>
 </div>

 <div data-baseline-check="box" data-baseline-ignore="true" data-baseline-label="badge nested specimen">
 <div class="bf-cluster" data-baseline-check="box" data-baseline-ignore="true" data-baseline-label="badge nested row">
 <button class="bf-chip" type="button" data-baseline-check="box" data-baseline-ignore="true" data-baseline-label="badge chip">
 <span class="bf-chip-value" data-baseline-ignore="true">Layers</span>
 <span class="bf-badge is-nested" data-block-derived-badge="nested-1" data-baseline-check="box" data-baseline-ignore="true" data-baseline-label="badge nested one character">7</span>
 <span class="bf-badge is-nested" data-block-derived-badge="nested-2" data-baseline-check="box" data-baseline-ignore="true" data-baseline-label="badge nested two characters">12</span>
 <span class="bf-badge is-nested" data-block-derived-badge="nested-3" data-baseline-check="box" data-baseline-ignore="true" data-baseline-label="badge nested three characters">123</span>
 <span class="bf-badge is-nested" data-block-derived-badge="nested-4" data-baseline-check="box" data-baseline-ignore="true" data-baseline-label="badge nested four characters">1234</span>
 <span class="bf-badge is-nested" data-block-derived-badge="nested-5" data-baseline-check="box" data-baseline-ignore="true" data-baseline-label="badge nested five characters">12345</span>
 </button>
 </div>
 </div>
 </section>
  <script type="module" src="../component-demo.js"></script>
</body>
</html>
