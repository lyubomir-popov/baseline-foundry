<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Search Box Demo</title>
  <link rel="stylesheet" href="../../dist/presets/panel/styles.css">
  <link rel="stylesheet" href="../component-shell.css">
</head>
<body class="vr-theme" data-bf-tone="dark" data-component-capture>
<section class="bf-stack" data-baseline-check="box" data-baseline-label="search box section">
 <div class="bf-search-box" data-baseline-check="box" data-baseline-label="search box component">
 <input class="bf-search-box-input bf-input" type="search" value="Ubuntu Summit" data-baseline-check="box" data-baseline-label="search box input">
 <button class="bf-search-box-reset" type="button" data-baseline-check="box" data-baseline-label="search box reset">Reset</button>
 <button class="bf-search-box-button" type="button" data-baseline-check="box" data-baseline-label="search box button">Search</button>
 </div>
 </section>
  <script type="module" src="../component-demo.js"></script>
</body>
</html>
