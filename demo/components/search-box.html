<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Search Box Demo</title>
  <link rel="stylesheet" href="../../dist/presets/panel/styles.css?v=20260329-panel-refresh-19">
  <link rel="stylesheet" href="../component-shell.css?v=20260329-panel-refresh-19">
</head>
<body>
  <main class="component-demo-page component-demo-page--panel vr-theme" data-bf-tone="dark">
    <header class="component-demo-header">
      <div>
        <h5 class="bf-h5 component-demo-kicker">Search Box</h5>
        <h1>Dense search input</h1>
        <p class="component-demo-meta">The search box uses the same field sizing as the rest of the compact preset, with reset and search affordances inside the row.</p>
      </div>
      <div class="component-demo-toolbar">
        <label class="component-demo-toggle" for="baseline-grid-toggle">
          <input id="baseline-grid-toggle" class="js-baseline-toggle" type="checkbox" aria-controls="component-grid-target">
          Show baseline grid
        </label>
      </div>
    </header>

    <section class="component-demo-stage component-demo-stack" id="component-grid-target" data-component-capture>
      <section class="component-demo-surface component-demo-flow-box" data-baseline-check="box" data-baseline-label="search box section">
        <div class="bf-search-box" data-baseline-check="box" data-baseline-label="search box component">
          <input class="bf-search-box-input bf-input" type="search" value="Ubuntu Summit" data-baseline-check="box" data-baseline-label="search box input">
          <button class="bf-search-box-reset" type="button" data-baseline-check="box" data-baseline-label="search box reset">Reset</button>
          <button class="bf-search-box-button" type="button" data-baseline-check="box" data-baseline-label="search box button">Search</button>
        </div>
      </section>
    </section>
  </main>

  <script type="module" src="../component-demo.js?v=20260329-panel-refresh-19"></script>
</body>
</html>
