<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Figure Demo</title>
  <link rel="stylesheet" href="../../dist/tiers/editorial/styles.css">
  <link rel="stylesheet" href="../component-shell.css">
</head>
<body class="bf-theme is-dark" data-component-capture>
<section class="bf-stack" data-baseline-check="box" data-baseline-label="figure page">
  <h5 class="bf-h5" data-baseline-check="flow" data-baseline-label="figure kicker">Figure</h5>
  <p class="bf-body" data-baseline-check="flow" data-baseline-label="figure summary">Native figure wrapper for media with an optional italic caption.</p>

  <section class="bf-stack" data-baseline-check="box" data-baseline-label="figure with caption block">
    <h6 data-baseline-check="flow" data-baseline-label="figure with caption title">Figure with caption</h6>
    <figure class="bf-figure" data-baseline-check="box" data-baseline-label="figure with caption component">
      <div class="bf-aspect is-16-9" style="inline-size:min(100%, calc(var(--bf-baseline) * 48));">
        <svg viewBox="0 0 160 90" role="img" aria-label="Placeholder media" xmlns="http://www.w3.org/2000/svg" style="background:#222;display:block;inline-size:100%;block-size:100%">
          <rect x="0" y="0" width="160" height="90" fill="#2c2c2c" />
          <text x="50%" y="50%" fill="#888" font-size="10" text-anchor="middle" dominant-baseline="middle">Media placeholder</text>
        </svg>
      </div>
      <figcaption class="bf-figure-caption">Caption beneath the media.</figcaption>
    </figure>
  </section>

  <section class="bf-stack" data-baseline-check="box" data-baseline-label="figure no caption block">
    <h6 data-baseline-check="flow" data-baseline-label="figure no caption title">Figure without caption</h6>
    <figure class="bf-figure" data-baseline-check="box" data-baseline-label="figure no caption component">
      <div class="bf-aspect is-3-2" style="inline-size:min(100%, calc(var(--bf-baseline) * 48));">
        <svg viewBox="0 0 3 2" role="img" aria-label="Placeholder media" xmlns="http://www.w3.org/2000/svg" style="background:#222;display:block;inline-size:100%;block-size:100%">
          <rect x="0" y="0" width="3" height="2" fill="#2c2c2c" />
          <text x="50%" y="50%" fill="#888" font-size="0.16" text-anchor="middle" dominant-baseline="middle">Media</text>
        </svg>
      </div>
    </figure>
  </section>

  <section class="bf-stack" data-baseline-check="box" data-baseline-label="figure prose block">
    <h6 data-baseline-check="flow" data-baseline-label="figure prose title">Figure within a prose flow</h6>
    <p data-baseline-check="flow" data-baseline-label="figure prose lead">Lead paragraph before the figure.</p>
    <figure class="bf-figure" data-baseline-check="box" data-baseline-label="figure prose component">
      <div class="bf-aspect is-16-9" style="inline-size:min(100%, calc(var(--bf-baseline) * 48));">
        <svg viewBox="0 0 160 90" role="img" aria-label="Placeholder media" xmlns="http://www.w3.org/2000/svg" style="background:#222;display:block;inline-size:100%;block-size:100%">
          <rect x="0" y="0" width="160" height="90" fill="#2c2c2c" />
          <text x="50%" y="50%" fill="#888" font-size="10" text-anchor="middle" dominant-baseline="middle">Inline figure</text>
        </svg>
      </div>
      <figcaption class="bf-figure-caption">Caption for inline article media.</figcaption>
    </figure>
    <p data-baseline-check="flow" data-baseline-label="figure prose trail">Trailing paragraph after the figure.</p>
  </section>
</section>
  <script type="module" src="../component-demo.js"></script>
</body>
</html>
