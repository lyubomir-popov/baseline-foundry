<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Divider Demo</title>
  <link rel="stylesheet" href="../../dist/presets/panel/styles.css">
  <link rel="stylesheet" href="../component-shell.css">
</head>
<body class="bf-theme" data-bf-tone="dark" data-component-capture>
<section class="bf-stack" data-baseline-check="box" data-baseline-label="divider section">
 <div class="bf-divider" data-baseline-check="box" data-baseline-label="divider component">
 <section class="bf-divider-block" data-baseline-check="box" data-baseline-label="divider block 1">
 <p class="bf-h6" data-baseline-check="flow" data-baseline-label="divider heading 1">Current document</p>
 <p class="bf-body" data-baseline-check="flow" data-baseline-label="divider body 1">The divider keeps dense inspector summaries readable while switching between stacked and split layouts.</p>
 </section>
 <section class="bf-divider-block" data-baseline-check="box" data-baseline-label="divider block 2">
 <p class="bf-h6" data-baseline-check="flow" data-baseline-label="divider heading 2">Output defaults</p>
 <p class="bf-body" data-baseline-check="flow" data-baseline-label="divider body 2">Borders compensate cleanly in both orientations.</p>
 </section>
 </div>
 </section>
  <script type="module" src="../component-demo.js"></script>
</body>
</html>
