<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pagination Demo</title>
  <link rel="stylesheet" href="../../dist/presets/panel/styles.css">
  <link rel="stylesheet" href="../component-shell.css">
</head>
<body class="vr-theme" data-bf-tone="dark" data-component-capture>
<section class="bf-stack" data-baseline-check="box" data-baseline-label="pagination section">
 <nav class="bf-pagination" aria-label="Pagination" data-baseline-check="box" data-baseline-label="pagination component">
 <ul class="bf-pagination-items" data-baseline-check="box" data-baseline-label="pagination list">
 <li class="bf-pagination-item" data-baseline-ignore="true"><a class="bf-pagination-link is-previous" href="#" aria-label="Previous page" data-baseline-check="box" data-baseline-label="pagination previous">Previous</a></li>
 <li class="bf-pagination-item" data-baseline-ignore="true"><a class="bf-pagination-link" href="#" data-baseline-check="box" data-baseline-label="pagination page 1">1</a></li>
 <li class="bf-pagination-item" data-baseline-ignore="true"><a class="bf-pagination-link" href="#" aria-current="page" data-baseline-check="box" data-baseline-label="pagination page 2">2</a></li>
 <li class="bf-pagination-item" data-baseline-ignore="true"><span class="bf-pagination-item is-truncation" data-baseline-check="box" data-baseline-label="pagination truncation">...</span></li>
 <li class="bf-pagination-item" data-baseline-ignore="true"><a class="bf-pagination-link" href="#" data-baseline-check="box" data-baseline-label="pagination page 8">8</a></li>
 <li class="bf-pagination-item" data-baseline-ignore="true"><a class="bf-pagination-link is-next" href="#" aria-label="Next page" data-baseline-check="box" data-baseline-label="pagination next">Next</a></li>
 </ul>
 </nav>
 </section>
  <script type="module" src="../component-demo.js"></script>
</body>
</html>
