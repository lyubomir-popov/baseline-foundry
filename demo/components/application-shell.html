<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Application Shell Demo</title>
  <link rel="stylesheet" href="../../dist/presets/panel/styles.css">
  <link rel="stylesheet" href="../component-shell.css">
</head>
<body class="bf-theme is-dark">
  <div class="bf-application has-pinned-aside" data-aside-resize-storage-key="demo:application-shell-aside" data-baseline-ignore="true" style="min-block-size:calc(var(--bf-baseline)*72)">
    <main class="bf-main" data-baseline-ignore="true">
      <div class="bf-stage-shell" data-baseline-ignore="true">
        <div class="bf-fixed-width" data-baseline-ignore="true">
          <div data-baseline-ignore="true" style="align-content:start;display:grid;min-block-size:calc(var(--bf-baseline)*56);padding:calc(var(--bf-baseline)*4)">
            <h5 class="bf-h5">Canvas</h5>
            <p class="bf-body">The stage stays centered while the pinned inspector keeps its own width contract.</p>
          </div>
        </div>
      </div>
    </main>
    <aside id="application-shell-aside" class="bf-aside is-pinned" data-baseline-ignore="true">
      <div class="bf-application-aside-resize-handle" role="separator" tabindex="0" aria-controls="application-shell-aside" aria-label="Resize panel" aria-orientation="vertical" data-baseline-ignore="true"></div>
      <section class="bf-panel" data-component-capture data-baseline-check="box" data-baseline-label="application panel">
        <div class="bf-panel-header is-sticky" data-baseline-ignore="true">
          <h2 class="bf-panel-title" data-baseline-check="flow" data-baseline-label="application panel title">Brand Layout Ops</h2>
          <div class="bf-panel-controls" data-baseline-check="box" data-baseline-label="application panel controls">
            <button class="bf-button is-base" type="button" data-baseline-check="box" data-baseline-label="application close button">Close</button>
          </div>
        </div>
        <div class="bf-panel-content" data-baseline-ignore="true" style="display:grid;gap:var(--bf-field-gap)">
          <h5 class="bf-h5" data-baseline-check="flow" data-baseline-label="application inspector kicker">Inspector</h5>
          <p class="bf-body" data-baseline-check="flow" data-baseline-label="application inspector body">The pinned panel owns its own padding, sticky header, and internal control grid without needing a second framework bundle.</p>
          <div class="bf-grid is-controls" data-baseline-check="box" data-baseline-label="application inspector grid">
            <div class="bf-grid-item is-control-pair" data-baseline-check="box" data-baseline-label="application inspector stat 1">
              <h5 class="bf-h5" data-baseline-check="flow" data-baseline-label="application inspector stat kicker 1">Rows</h5>
              <p class="bf-body" data-baseline-check="flow" data-baseline-label="application inspector stat body 1">24</p>
            </div>
            <div class="bf-grid-item is-control-pair" data-baseline-check="box" data-baseline-label="application inspector stat 2">
              <h5 class="bf-h5" data-baseline-check="flow" data-baseline-label="application inspector stat kicker 2">Grid</h5>
              <p class="bf-body" data-baseline-check="flow" data-baseline-label="application inspector stat body 2">8 cols</p>
            </div>
          </div>
        </div>
      </section>
    </aside>
  </div>
  <script type="module" src="../component-demo.js"></script>
</body>
</html>
