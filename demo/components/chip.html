<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chip Demo</title>
  <link rel="stylesheet" href="../../dist/presets/panel/styles.css?v=20260328-panel-refresh-13">
  <link rel="stylesheet" href="../component-shell.css?v=20260328-panel-refresh-13">
</head>
<body>
  <main class="component-demo-page component-demo-page--panel vr-theme" data-bf-tone="dark">
    <header class="component-demo-header">
      <div>
        <h5 class="bf-h5 component-demo-kicker">Chip</h5>
        <h1>Dense chip variants</h1>
        <p class="component-demo-meta">Chips now use the panel preset directly, with the metadata lead taking the real uppercase `h5` treatment rather than faux caps.</p>
      </div>
      <div class="component-demo-toolbar">
        <label class="component-demo-toggle" for="baseline-grid-toggle">
          <input id="baseline-grid-toggle" class="js-baseline-toggle" type="checkbox" aria-controls="component-grid-target">
          Show baseline grid
        </label>
      </div>
    </header>

    <section class="component-demo-stage component-demo-stack" id="component-grid-target" data-component-capture>
      <section class="component-demo-surface component-demo-flow-box" data-baseline-check="box" data-baseline-label="chip section">
        <div class="component-demo-cluster" data-baseline-check="box" data-baseline-label="chip row">
          <button class="p-chip" type="button" data-baseline-check="box" data-baseline-label="chip default">
            <span class="p-chip__lead" data-baseline-ignore="true">Mode</span>
            <span class="p-chip__value" data-baseline-ignore="true">Frame</span>
          </button>
          <button class="p-chip--positive" type="button" data-baseline-check="box" data-baseline-label="chip positive">Saved</button>
          <button class="p-chip--caution" type="button" data-baseline-check="box" data-baseline-label="chip caution">Review</button>
          <button class="p-chip--negative" type="button" data-baseline-check="box" data-baseline-label="chip negative">Error</button>
        </div>
      </section>
    </section>
  </main>

  <script type="module" src="../component-demo.js?v=20260328-panel-refresh-13"></script>
</body>
</html>
