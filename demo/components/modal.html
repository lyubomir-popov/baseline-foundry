<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Modal Demo</title>
  <link rel="stylesheet" href="../../dist/presets/panel/styles.css?v=20260329-panel-refresh-19">
  <link rel="stylesheet" href="../component-shell.css?v=20260329-panel-refresh-19">
</head>
<body>
  <main class="component-demo-page component-demo-page--panel vr-theme" data-bf-tone="dark">
    <header class="component-demo-header">
      <div>
        <h5 class="bf-h5 component-demo-kicker">Modal</h5>
        <h1>Dense modal surface</h1>
        <p class="component-demo-meta">Header, body, footer, and actions all use the same panel spacing tokens as the rest of the compact preset.</p>
      </div>
      <div class="component-demo-toolbar">
        <label class="component-demo-toggle" for="baseline-grid-toggle">
          <input id="baseline-grid-toggle" class="js-baseline-toggle" type="checkbox" aria-controls="component-grid-target">
          Show baseline grid
        </label>
      </div>
    </header>

    <section class="component-demo-stage component-demo-stack" id="component-grid-target" data-component-capture>
      <section class="component-demo-surface component-demo-flow-box" data-baseline-check="box" data-baseline-label="modal section">
        <div class="bf-modal-dialog" data-baseline-check="box" data-baseline-label="modal dialog">
          <div class="bf-modal-header" data-baseline-ignore="true">
            <h2 class="bf-modal-title" data-baseline-check="flow" data-baseline-label="modal title">Export PNG Sequence</h2>
            <button class="bf-modal-close" type="button" data-baseline-check="box" data-baseline-label="modal close">Close</button>
          </div>
          <div class="bf-modal-body" data-baseline-ignore="true">
            <p class="bf-form-help" data-baseline-check="flow" data-baseline-label="modal text">The export dialog now shares the same panel spacing and field rhythm as the rest of the package.</p>
          </div>
          <div class="bf-modal-footer" data-baseline-ignore="true">
            <button class="bf-button is-base" type="button" data-baseline-check="box" data-baseline-label="modal cancel">Cancel</button>
            <button class="bf-button" type="button" data-baseline-check="box" data-baseline-label="modal export">Export</button>
          </div>
        </div>
      </section>
    </section>
  </main>

  <script type="module" src="../component-demo.js?v=20260329-panel-refresh-19"></script>
</body>
</html>
