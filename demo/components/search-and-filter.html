<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Search and Filter Demo</title>
  <link rel="stylesheet" href="../../dist/tiers/editorial/styles.css">
  <link rel="stylesheet" href="../component-shell.css">
</head>
<body class="bf-theme is-dark" data-component-capture>
<section class="bf-stack">
 <section class="bf-stack" data-baseline-check="box" data-baseline-label="compact control row section" data-overflow-container>
 <h1 class="bf-h4" data-baseline-check="flow" data-baseline-label="compact control row title">Compact control row</h1>
 <form class="bf-control-row" role="search" aria-label="Registry filters" data-baseline-check="box" data-overflow-check data-baseline-label="compact control row">
 <div class="bf-field" data-baseline-check="box" data-baseline-label="control row search field">
 <label class="bf-form-label" for="control-row-query" data-baseline-check="flow" data-baseline-label="control row search label">Search diagrams</label>
 <div class="bf-control" data-baseline-check="box" data-baseline-label="control row search control"><input id="control-row-query" class="bf-input" type="search" value="Ubuntu" data-baseline-check="box" data-baseline-label="control row search input"></div>
 </div>
 <div class="bf-field" data-baseline-check="box" data-baseline-label="control row tier field">
 <label class="bf-form-label" for="control-row-tier" data-baseline-check="flow" data-baseline-label="control row tier label">Tier</label>
 <div class="bf-control" data-baseline-check="box" data-baseline-label="control row tier control"><select id="control-row-tier" data-baseline-check="box" data-baseline-label="control row tier select"><option>Editorial</option><option>Documentation</option><option>App</option><option>OS</option></select></div>
 </div>
 <button class="bf-button" type="submit" data-baseline-check="box" data-baseline-label="control row submit">Apply filters</button>
 </form>
 </section>

 <div >
 <div class="bf-search-and-filter" data-baseline-ignore="true">
 <div class="bf-search-and-filter-search-container" aria-expanded="false" data-baseline-ignore="true" data-baseline-label="search and filter collapsed container">
 <div class="bf-search-and-filter-box" data-baseline-ignore="true" data-baseline-label="search and filter collapsed box">
 <input class="bf-search-and-filter-input bf-input" type="search" value="Ubuntu" data-baseline-ignore="true" data-baseline-label="search and filter collapsed input">
 <button class="bf-search-and-filter-clear" type="button" data-baseline-ignore="true" data-baseline-label="search and filter collapsed clear">Clear</button>
 <button class="bf-search-and-filter-search-button" type="button" data-baseline-ignore="true" data-baseline-label="search and filter collapsed search">Search</button>
 </div>
 <button class="bf-search-and-filter-selected-count" type="button" data-baseline-ignore="true" data-baseline-label="search and filter selected count">6 selected</button>
 </div>
 <div class="bf-search-and-filter-panel" aria-hidden="true" data-baseline-ignore="true"></div>
 </div>
 </div>

 <div >
 <div class="bf-search-and-filter" data-baseline-ignore="true">
 <div class="bf-search-and-filter-search-container" aria-expanded="true" data-baseline-ignore="true" data-baseline-label="search and filter expanded container">
 <div class="bf-search-and-filter-box" data-baseline-ignore="true" data-baseline-label="search and filter expanded box">
 <input class="bf-search-and-filter-input bf-input" type="search" value="Ubuntu" data-baseline-ignore="true" data-baseline-label="search and filter expanded input">
 <button class="bf-search-and-filter-clear" type="button" data-baseline-ignore="true" data-baseline-label="search and filter expanded clear">Clear</button>
 <button class="bf-search-and-filter-search-button" type="button" data-baseline-ignore="true" data-baseline-label="search and filter expanded search">Search</button>
 </div>
 <button class="bf-search-and-filter-selected-count" type="button" data-baseline-ignore="true">6 selected</button>
 </div>
 <div class="bf-search-and-filter-panel" aria-hidden="false" data-baseline-ignore="true" data-baseline-label="search and filter panel">
 <section class="bf-filter-panel-section" data-baseline-check="box" data-baseline-ignore="true" data-baseline-label="search filter section one">
 <h5 class="bf-filter-panel-section-heading bf-h5" data-baseline-check="flow" data-baseline-ignore="true" data-baseline-label="search filter heading">Format</h5>
 <div class="bf-filter-panel-section-chips" aria-expanded="true" data-baseline-check="box" data-baseline-ignore="true" data-baseline-label="search filter chips">
 <button class="bf-chip is-inline" type="button" data-baseline-check="box" data-baseline-ignore="true" data-baseline-label="search filter chip 1">Landscape</button>
 <button class="bf-chip is-inline" type="button" data-baseline-check="box" data-baseline-ignore="true" data-baseline-label="search filter chip 2">Square</button>
 <button class="bf-chip is-information is-inline" type="button" data-baseline-check="box" data-baseline-ignore="true" data-baseline-label="search filter chip 3">Portrait</button>
 </div>
 </section>
 <section class="bf-filter-panel-section" data-baseline-check="box" data-baseline-ignore="true" data-baseline-label="search filter section two">
 <h5 class="bf-filter-panel-section-heading bf-h5" data-baseline-check="flow" data-baseline-ignore="true" data-baseline-label="search filter heading two">Status</h5>
 <div class="bf-filter-panel-section-chips" aria-expanded="true" data-baseline-check="box" data-baseline-ignore="true" data-baseline-label="search filter chips two">
 <button class="bf-chip is-positive is-inline" type="button" data-baseline-check="box" data-baseline-ignore="true" data-baseline-label="search filter chip 4">Saved</button>
 <button class="bf-chip is-caution is-inline" type="button" data-baseline-check="box" data-baseline-ignore="true" data-baseline-label="search filter chip 5">Review</button>
 </div>
 </section>
 </div>
 </div>
 </div>
 </section>
  <script type="module" src="../component-demo.js"></script>
</body>
</html>
