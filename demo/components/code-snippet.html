<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Code Snippet Demo</title>
  <link rel="stylesheet" href="../../dist/presets/panel/styles.css">
  <link rel="stylesheet" href="../component-shell.css">
</head>
<body class="vr-theme" data-bf-tone="dark" data-component-capture>
<section class="bf-stack" data-baseline-check="box" data-baseline-label="code snippet section">
 <div class="bf-code-snippet" data-baseline-check="box" data-baseline-label="code snippet install">
 <div class="bf-code-snippet-header" data-baseline-check="box" data-baseline-label="code snippet install header">
 <h5 class="bf-code-snippet-title" data-baseline-check="flow" data-baseline-label="code snippet install title">Install the panel preset</h5>
 </div>
 <pre class="bf-code-snippet-block is-icon" tabindex="0" role="button" title="Copy to clipboard" data-baseline-check="box" data-baseline-label="code snippet install block"><code>npm install baseline-foundry</code></pre>
 </div>

 <div class="bf-code-snippet is-bordered" data-baseline-check="box" data-baseline-label="code snippet wrapped">
 <div class="bf-code-snippet-header is-stacked" data-baseline-check="box" data-baseline-label="code snippet wrapped header">
 <h5 class="bf-code-snippet-title" data-baseline-check="flow" data-baseline-label="code snippet wrapped title">Remote preset reference</h5>
 <div class="bf-code-snippet-dropdowns" data-baseline-ignore="true">
 <button class="bf-code-snippet-dropdown" type="button" data-baseline-check="box" data-baseline-label="code snippet wrapped action">Open docs</button>
 </div>
 </div>
 <pre class="bf-code-snippet-block is-icon is-url is-wrapped" tabindex="0" role="button" title="Copy URL" data-baseline-check="box" data-baseline-label="code snippet wrapped block"><code>https://example.com/design-systems/baseline-foundry/presets/panel?mode=compact&amp;surface=inspector</code></pre>
 </div>

 <div class="bf-code-snippet" data-baseline-check="box" data-baseline-label="code snippet numbered">
 <pre class="bf-code-snippet-block is-numbered" data-baseline-check="box" data-baseline-label="code snippet numbered block"><code><span class="bf-code-snippet-line" data-baseline-check="flow" data-baseline-label="code snippet numbered line 1">import { initCodeSnippets } from "baseline-foundry";</span>
<span class="bf-code-snippet-line" data-baseline-check="flow" data-baseline-label="code snippet numbered line 2">import "baseline-foundry/presets/panel.css";</span>
<span class="bf-code-snippet-line" data-baseline-check="flow" data-baseline-label="code snippet numbered line 3"></span>
<span class="bf-code-snippet-line" data-baseline-check="flow" data-baseline-label="code snippet numbered line 4">initCodeSnippets();</span></code></pre>
 </div>
 </section>
  <script type="module" src="../component-demo.js"></script>
</body>
</html>
