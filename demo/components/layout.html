<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Layout Primitives Demo</title>
  <link rel="stylesheet" href="../../dist/tiers/editorial/styles.css">
  <link rel="stylesheet" href="../component-shell.css">
</head>
<body class="bf-theme is-dark" data-component-capture>
<section class="bf-section">
 <div class="bf-measure" data-baseline-check="box" data-baseline-label="measure card">
 <h5 class="bf-h5" data-baseline-check="flow" data-baseline-label="measure kicker">Measure</h5>
 <p class="bf-body" data-baseline-check="flow" data-baseline-label="measure body">The fixed reading measure should stay calm even when the outer page stretches much wider.</p>
 </div>
 </section>

 <section class="bf-strip">
 <div class="bf-stack">
 <div data-baseline-check="box" data-baseline-label="stack card 1">
 <h5 class="bf-h5" data-baseline-check="flow" data-baseline-label="stack kicker">Stack</h5>
 <p class="bf-body" data-baseline-check="flow" data-baseline-label="stack body">Stack is for discrete blocks, not prose flow.</p>
 </div>
 <div data-baseline-check="box" data-baseline-label="stack card 2">
 <p class="bf-body" data-baseline-check="flow" data-baseline-label="stack support body">The gap itself should stay on the rhythm.</p>
 </div>
 <div data-baseline-check="box" data-baseline-label="cluster card">
 <div class="bf-cluster" data-baseline-check="box" data-baseline-label="cluster row">
 <span data-baseline-check="box" data-baseline-label="cluster chip 1">Cluster</span>
 <span data-baseline-check="box" data-baseline-label="cluster chip 2">Toolbar</span>
 <span data-baseline-check="box" data-baseline-label="cluster chip 3">Tags</span>
 <span data-baseline-check="box" data-baseline-label="cluster chip 4">Actions</span>
 </div>
 <div class="bf-cluster is-split" data-baseline-check="box" data-baseline-label="split cluster row">
 <span data-baseline-check="box" data-baseline-label="split cluster label">Split cluster</span>
 <span data-baseline-check="box" data-baseline-label="split cluster actions">Actions</span>
 </div>
 </div>
 </div>
 </section>
  <script type="module" src="../component-demo.js"></script>
</body>
</html>
