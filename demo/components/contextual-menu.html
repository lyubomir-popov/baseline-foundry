<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contextual Menu Demo</title>
  <link rel="stylesheet" href="../../dist/presets/panel/styles.css?v=20260328-panel-refresh-17">
  <link rel="stylesheet" href="../component-shell.css?v=20260328-panel-refresh-17">
</head>
<body>
  <main class="component-demo-page component-demo-page--panel vr-theme" data-bf-tone="dark">
    <header class="component-demo-header">
      <div>
        <h5 class="bf-h5 component-demo-kicker">Contextual Menu</h5>
        <h1>Dense action dropdown</h1>
        <p class="component-demo-meta">Action menus now live here as a compact component family rather than staying trapped in the old compatibility package.</p>
      </div>
      <div class="component-demo-toolbar">
        <label class="component-demo-toggle" for="baseline-grid-toggle">
          <input id="baseline-grid-toggle" class="js-baseline-toggle" type="checkbox" aria-controls="component-grid-target">
          Show baseline grid
        </label>
      </div>
    </header>

    <section class="component-demo-stage component-demo-stack" id="component-grid-target" data-component-capture>
      <section class="component-demo-surface component-demo-flow-box" data-baseline-ignore="true">
        <div class="p-contextual-menu" data-baseline-ignore="true">
          <button class="p-button--base is-dense p-contextual-menu__toggle" type="button" aria-expanded="true" data-baseline-check="box" data-baseline-label="contextual menu toggle">Actions</button>
          <ul class="p-contextual-menu__dropdown" aria-hidden="false" data-baseline-ignore="true">
            <li class="p-contextual-menu__group" data-baseline-check="box" data-baseline-label="contextual menu group one">
              <button class="p-contextual-menu__link" type="button" data-baseline-check="box" data-baseline-label="contextual menu link one">Duplicate layout</button>
              <button class="p-contextual-menu__link" type="button" data-baseline-check="box" data-baseline-label="contextual menu link two">Create variant</button>
            </li>
            <li class="p-contextual-menu__group" data-baseline-check="box" data-baseline-label="contextual menu group two">
              <button class="p-contextual-menu__link" type="button" data-baseline-check="box" data-baseline-label="contextual menu link three">Archive preset</button>
            </li>
          </ul>
        </div>
      </section>
    </section>
  </main>

  <script type="module" src="../component-demo.js?v=20260328-panel-refresh-17"></script>
</body>
</html>
