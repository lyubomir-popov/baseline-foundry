<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contextual Menu Demo</title>
  <link rel="stylesheet" href="../../dist/tiers/editorial/styles.css">
  <link rel="stylesheet" href="../component-shell.css">
</head>
<body class="bf-theme is-dark" data-component-capture>
<section class="bf-stack" data-baseline-ignore="true">
 <div class="bf-contextual-menu" data-baseline-ignore="true">
 <button class="bf-button is-base bf-contextual-menu-toggle" type="button" aria-expanded="true" data-baseline-check="box" data-baseline-label="contextual menu toggle">Actions</button>
 <ul class="bf-contextual-menu-dropdown" aria-hidden="false" data-baseline-ignore="true">
 <li class="bf-contextual-menu-group" data-baseline-check="box" data-baseline-label="contextual menu group one">
 <button class="bf-contextual-menu-link" type="button" data-baseline-check="box" data-baseline-label="contextual menu link one">Duplicate layout</button>
 <button class="bf-contextual-menu-link" type="button" data-baseline-check="box" data-baseline-label="contextual menu link two">Create variant</button>
 </li>
 <li class="bf-contextual-menu-group" data-baseline-check="box" data-baseline-label="contextual menu group two">
 <button class="bf-contextual-menu-link" type="button" data-baseline-check="box" data-baseline-label="contextual menu link three">Archive preset</button>
 </li>
 </ul>
 </div>
 </section>
  <script type="module" src="../component-demo.js"></script>
</body>
</html>
