<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Accordion Demo</title>
  <link rel="stylesheet" href="../../dist/presets/panel/styles.css">
  <link rel="stylesheet" href="../component-shell.css">
</head>
<body class="bf-theme" data-bf-tone="dark" data-component-capture>
<section class="bf-stack" data-baseline-check="box" data-baseline-label="accordion section">
 <div class="bf-accordion" data-baseline-check="box" data-baseline-label="accordion component">
 <ul class="bf-accordion-list" data-baseline-ignore="true">
 <li class="bf-accordion-group" data-baseline-ignore="true">
 <div class="bf-accordion-heading">
 <button class="bf-accordion-tab" type="button" aria-expanded="true" aria-controls="accordion-panel-1" data-baseline-check="box" data-baseline-label="accordion tab 1">Playback</button>
 </div>
 <div id="accordion-panel-1" class="bf-accordion-panel" aria-hidden="false" data-baseline-check="box" data-baseline-label="accordion panel 1">
 <p class="bf-body" data-baseline-check="flow" data-baseline-label="accordion body 1">Accordion tabs intentionally stay at body size rather than turning into fake headings.</p>
 </div>
 </li>
 <li class="bf-accordion-group" data-baseline-ignore="true">
 <div class="bf-accordion-heading">
 <button class="bf-accordion-tab" type="button" aria-expanded="false" aria-controls="accordion-panel-2" data-baseline-check="box" data-baseline-label="accordion tab 2">Defaults</button>
 </div>
 <div id="accordion-panel-2" class="bf-accordion-panel" aria-hidden="true" data-baseline-ignore="true">
 <p class="bf-body">Hidden accordion content.</p>
 </div>
 </li>
 </ul>
 </div>
 </section>
  <script type="module" src="../component-demo.js"></script>
</body>
</html>
