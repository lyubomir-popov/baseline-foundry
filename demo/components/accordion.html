<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Accordion Demo</title>
  <link rel="stylesheet" href="../../dist/presets/panel/styles.css?v=20260328-panel-refresh-8">
  <link rel="stylesheet" href="../component-shell.css?v=20260328-panel-refresh-8">
</head>
<body>
  <main class="component-demo-page component-demo-page--panel vr-theme" data-bf-tone="dark">
    <header class="component-demo-header">
      <div>
        <h5 class="bf-h5 component-demo-kicker">Accordion</h5>
        <h1>Dense accordion rows</h1>
        <p class="component-demo-meta">Accordion rows use the compact control height and leave a clean baseline step before their panel body starts.</p>
      </div>
      <div class="component-demo-toolbar">
        <label class="component-demo-toggle" for="baseline-grid-toggle">
          <input id="baseline-grid-toggle" class="js-baseline-toggle" type="checkbox" aria-controls="component-grid-target">
          Show baseline grid
        </label>
      </div>
    </header>

    <section class="component-demo-stage component-demo-stack" id="component-grid-target" data-component-capture>
      <section class="component-demo-surface component-demo-flow-box" data-baseline-check="box" data-baseline-label="accordion section">
        <div class="p-accordion" data-baseline-check="box" data-baseline-label="accordion component">
          <ul class="p-accordion__list" data-baseline-ignore="true">
            <li class="p-accordion__group" data-baseline-ignore="true">
              <div class="p-accordion__heading">
                <button class="p-accordion__tab" type="button" aria-expanded="true" aria-controls="accordion-panel-1" data-baseline-check="box" data-baseline-label="accordion tab 1">Playback</button>
              </div>
              <div id="accordion-panel-1" class="p-accordion__panel" aria-hidden="false" data-baseline-check="box" data-baseline-label="accordion panel 1">
                <p class="bf-body" data-baseline-check="flow" data-baseline-label="accordion body 1">Accordion tabs intentionally stay at body size rather than turning into fake headings.</p>
              </div>
            </li>
            <li class="p-accordion__group" data-baseline-ignore="true">
              <div class="p-accordion__heading">
                <button class="p-accordion__tab" type="button" aria-expanded="false" aria-controls="accordion-panel-2" data-baseline-check="box" data-baseline-label="accordion tab 2">Defaults</button>
              </div>
              <div id="accordion-panel-2" class="p-accordion__panel" aria-hidden="true" data-baseline-ignore="true">
                <p class="bf-body">Hidden accordion content.</p>
              </div>
            </li>
          </ul>
        </div>
      </section>
    </section>
  </main>

  <script type="module" src="../component-demo.js?v=20260328-panel-refresh-8"></script>
</body>
</html>
