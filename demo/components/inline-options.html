<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inline Options Demo</title>
  <link rel="stylesheet" href="../../dist/presets/panel/styles.css?v=20260329-panel-refresh-19">
  <link rel="stylesheet" href="../component-shell.css?v=20260329-panel-refresh-19">
</head>
<body>
  <main class="component-demo-page component-demo-page--panel vr-theme" data-bf-tone="dark">
    <header class="component-demo-header">
      <div>
        <h5 class="bf-h5 component-demo-kicker">Inline Options</h5>
        <h1>Operator selector strip</h1>
        <p class="component-demo-meta">Inline radio choices now live in a canonical panel pattern instead of app-local styling.</p>
      </div>
      <div class="component-demo-toolbar">
        <label class="component-demo-toggle" for="baseline-grid-toggle">
          <input id="baseline-grid-toggle" class="js-baseline-toggle" type="checkbox" aria-controls="component-grid-target">
          Show baseline grid
        </label>
      </div>
    </header>

    <section class="component-demo-stage component-demo-stack" id="component-grid-target" data-component-capture>
      <section class="component-demo-surface component-demo-flow-box" data-baseline-check="box" data-baseline-label="inline options section">
        <div class="bf-inline-options" data-baseline-check="box" data-baseline-label="inline options canonical">
          <div class="bf-inline-options-heading" data-baseline-check="flow" data-baseline-label="inline options heading">Background Operator</div>
          <div class="bf-inline-options-options" data-baseline-check="box" data-baseline-label="inline options list">
            <label class="bf-inline-options-option" data-baseline-check="box" data-baseline-label="inline options option 1">
              <input type="radio" name="inline-options-canonical" checked data-baseline-ignore="true">
              <span>Halo</span>
            </label>
            <label class="bf-inline-options-option" data-baseline-check="box" data-baseline-label="inline options option 2">
              <input type="radio" name="inline-options-canonical" data-baseline-ignore="true">
              <span>Rays</span>
            </label>
            <label class="bf-inline-options-option" data-baseline-check="box" data-baseline-label="inline options option 3">
              <input type="radio" name="inline-options-canonical" data-baseline-ignore="true">
              <span>Field</span>
            </label>
          </div>
        </div>
      </section>
    </section>
  </main>

  <script type="module" src="../component-demo.js?v=20260329-panel-refresh-19"></script>
</body>
</html>
