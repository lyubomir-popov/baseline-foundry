<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Form Atlas Demo</title>
  <link rel="stylesheet" href="../../dist/tiers/editorial/styles.css">
  <link rel="stylesheet" href="../component-shell.css">
</head>
<body class="bf-theme is-dark">
  <main class="bf-page" data-component-capture data-overflow-container>
    <section class="bf-section is-shallow bf-cluster" data-baseline-check="box" data-baseline-label="form atlas row 1">
      <div class="bf-inline-size is-compact bf-stack is-flush">
        <p class="bf-body" data-baseline-check="flow" data-baseline-label="form atlas row 1 reference">test</p>
      </div>

      <button class="bf-button" type="button" data-baseline-check="box" data-baseline-label="form atlas button">test</button>

      <div class="bf-control bf-inline-size is-compact">
        <input class="bf-input" type="text" value="test" aria-label="Form atlas text input" data-baseline-check="box" data-baseline-label="form atlas text input">
      </div>

      <div class="bf-control bf-inline-size is-compact">
        <select aria-label="Form atlas select" data-baseline-check="box" data-baseline-label="form atlas select">
          <option selected>test</option>
          <option>alpha</option>
          <option>omega</option>
        </select>
      </div>

      <div class="bf-search-box bf-inline-size is-regular" data-baseline-check="box" data-baseline-label="form atlas search box">
        <input class="bf-search-box-input bf-input" type="search" value="test" aria-label="Form atlas search input" data-baseline-ignore="true">
        <button class="bf-search-box-reset" type="button" data-baseline-ignore="true">Reset</button>
        <button class="bf-search-box-button" type="button" data-baseline-ignore="true">Search</button>
      </div>
    </section>

    <section class="bf-section is-shallow bf-cluster" data-baseline-check="box" data-baseline-label="form atlas row 2">
      <div class="bf-inline-size is-compact bf-stack is-flush">
        <p class="bf-body" data-baseline-check="flow" data-baseline-label="form atlas row 2 reference">test</p>
      </div>

      <div class="bf-segmented-control bf-inline-size is-regular" data-baseline-check="box" data-baseline-label="form atlas segmented control">
        <ul class="bf-segmented-control-list" data-baseline-ignore="true">
          <li class="bf-segmented-control-item" data-baseline-ignore="true"><button class="bf-segmented-control-button is-active" type="button" aria-pressed="true" data-baseline-check="box" data-baseline-label="form atlas segmented button 1">test</button></li>
          <li class="bf-segmented-control-item" data-baseline-ignore="true"><button class="bf-segmented-control-button" type="button" aria-pressed="false" data-baseline-check="box" data-baseline-label="form atlas segmented button 2">alpha</button></li>
          <li class="bf-segmented-control-item" data-baseline-ignore="true"><button class="bf-segmented-control-button" type="button" aria-pressed="false" data-baseline-check="box" data-baseline-label="form atlas segmented button 3">omega</button></li>
        </ul>
      </div>

      <div class="bf-checkbox" data-baseline-check="box" data-baseline-label="form atlas checkbox">
        <input id="form-atlas-checkbox" class="bf-checkbox-input" type="checkbox" checked data-baseline-ignore="true">
        <label class="bf-checkbox-label" for="form-atlas-checkbox" data-baseline-check="flow" data-baseline-label="form atlas checkbox label">test</label>
      </div>

      <div class="bf-radio" data-baseline-check="box" data-baseline-label="form atlas radio">
        <input id="form-atlas-radio" class="bf-radio-input" name="form-atlas-radio-group" type="radio" checked data-baseline-ignore="true">
        <label class="bf-radio-label" for="form-atlas-radio" data-baseline-check="flow" data-baseline-label="form atlas radio label">test</label>
      </div>

      <label class="bf-switch" data-baseline-check="box" data-baseline-label="form atlas switch">
        <input class="bf-switch-input" type="checkbox" checked data-baseline-ignore="true">
        <span class="bf-switch-slider" aria-hidden="true"></span>
        <span class="bf-switch-label" data-baseline-check="flow" data-baseline-label="form atlas switch label">test</span>
      </label>
    </section>

    <section class="bf-section is-shallow bf-cluster" data-baseline-check="box" data-baseline-label="form atlas compare row">
      <div class="bf-inline-size is-compact bf-stack is-flush">
        <p class="bf-body" data-baseline-check="flow" data-baseline-label="form atlas compare reference">test</p>
      </div>

      <div class="bf-checkbox" data-baseline-check="box" data-baseline-label="form atlas compare checkbox">
        <input id="form-atlas-compare-checkbox" class="bf-checkbox-input" type="checkbox" checked data-baseline-ignore="true">
        <label class="bf-checkbox-label" for="form-atlas-compare-checkbox" data-baseline-check="flow" data-baseline-label="form atlas compare checkbox label">test</label>
      </div>

      <label class="bf-switch" data-baseline-check="box" data-baseline-label="form atlas compare switch">
        <input class="bf-switch-input" type="checkbox" checked data-baseline-ignore="true">
        <span class="bf-switch-slider" aria-hidden="true"></span>
        <span class="bf-switch-label" data-baseline-check="flow" data-baseline-label="form atlas compare switch label">test</span>
      </label>

      <div class="bf-radio" data-baseline-check="box" data-baseline-label="form atlas compare radio">
        <input id="form-atlas-compare-radio" class="bf-radio-input" name="form-atlas-compare-radio-group" type="radio" checked data-baseline-ignore="true">
        <label class="bf-radio-label" for="form-atlas-compare-radio" data-baseline-check="flow" data-baseline-label="form atlas compare radio label">test</label>
      </div>
    </section>

    <section class="bf-section is-shallow bf-cluster" data-baseline-check="box" data-baseline-label="form atlas tabs row">
      <div class="bf-inline-size is-compact bf-stack is-flush">
        <p class="bf-body" data-baseline-check="flow" data-baseline-label="form atlas tabs reference">test</p>
      </div>

      <div class="bf-tabs bf-inline-size is-medium" data-baseline-check="box" data-baseline-label="form atlas tabs">
        <ul class="bf-tabs-list" role="tablist" data-baseline-ignore="true">
          <li class="bf-tabs-item" role="presentation" data-baseline-ignore="true">
            <button class="bf-tabs-link" type="button" role="tab" aria-selected="true" aria-controls="form-atlas-tabs-panel-1" tabindex="0" data-baseline-check="box" data-baseline-label="form atlas tabs button 1">test</button>
          </li>
          <li class="bf-tabs-item" role="presentation" data-baseline-ignore="true">
            <button class="bf-tabs-link" type="button" role="tab" aria-selected="false" aria-controls="form-atlas-tabs-panel-2" tabindex="-1" data-baseline-check="box" data-baseline-label="form atlas tabs button 2">alpha</button>
          </li>
        </ul>
        <div id="form-atlas-tabs-panel-1" class="bf-tabs-panel" role="tabpanel" aria-hidden="false">
          <p class="bf-body" data-baseline-check="flow" data-baseline-label="form atlas tabs body">test</p>
        </div>
        <div id="form-atlas-tabs-panel-2" class="bf-tabs-panel" role="tabpanel" aria-hidden="true">
          <p class="bf-body" data-baseline-ignore="true">Hidden alpha panel.</p>
        </div>
      </div>

      <div class="bf-tabs is-equal bf-inline-size is-medium" data-baseline-check="box" data-baseline-label="form atlas equal tabs">
        <ul class="bf-tabs-list" role="tablist" data-baseline-ignore="true">
          <li class="bf-tabs-item" role="presentation" data-baseline-ignore="true">
            <button class="bf-tabs-link" type="button" role="tab" aria-selected="true" aria-controls="form-atlas-equal-tabs-panel-1" tabindex="0" data-baseline-check="box" data-baseline-label="form atlas equal tabs button 1">test</button>
          </li>
          <li class="bf-tabs-item" role="presentation" data-baseline-ignore="true">
            <button class="bf-tabs-link" type="button" role="tab" aria-selected="false" aria-controls="form-atlas-equal-tabs-panel-2" tabindex="-1" data-baseline-check="box" data-baseline-label="form atlas equal tabs button 2">alpha</button>
          </li>
          <li class="bf-tabs-item" role="presentation" data-baseline-ignore="true">
            <button class="bf-tabs-link" type="button" role="tab" aria-selected="false" aria-controls="form-atlas-equal-tabs-panel-3" tabindex="-1" data-baseline-check="box" data-baseline-label="form atlas equal tabs button 3">omega</button>
          </li>
        </ul>
        <div id="form-atlas-equal-tabs-panel-1" class="bf-tabs-panel" role="tabpanel" aria-hidden="false">
          <p class="bf-body" data-baseline-check="flow" data-baseline-label="form atlas equal tabs body">test</p>
        </div>
        <div id="form-atlas-equal-tabs-panel-2" class="bf-tabs-panel" role="tabpanel" aria-hidden="true">
          <p class="bf-body" data-baseline-ignore="true">Hidden alpha panel.</p>
        </div>
        <div id="form-atlas-equal-tabs-panel-3" class="bf-tabs-panel" role="tabpanel" aria-hidden="true">
          <p class="bf-body" data-baseline-ignore="true">Hidden omega panel.</p>
        </div>
      </div>
    </section>

    <section class="bf-section is-shallow bf-cluster" data-baseline-check="box" data-baseline-label="form atlas options row">
      <div class="bf-inline-size is-compact bf-stack is-flush">
        <p class="bf-body" data-baseline-check="flow" data-baseline-label="form atlas options reference">test</p>
      </div>

      <div class="bf-choice-list bf-inline-size is-wide" data-baseline-check="box" data-baseline-label="form atlas choice list">
        <label class="bf-choice-row" data-baseline-check="box" data-baseline-label="form atlas choice row 1">
          <input type="radio" name="form-atlas-choice-row" checked data-baseline-ignore="true">
          <span class="bf-choice-row-name">test</span>
          <span class="bf-choice-row-meta">active</span>
        </label>
        <label class="bf-choice-row" data-baseline-check="box" data-baseline-label="form atlas choice row 2">
          <input type="radio" name="form-atlas-choice-row" data-baseline-ignore="true">
          <span class="bf-choice-row-name">alpha</span>
          <span class="bf-choice-row-meta">other</span>
        </label>
      </div>

      <div class="bf-inline-options bf-inline-size is-wide" data-baseline-check="box" data-baseline-label="form atlas inline options">
        <div class="bf-inline-options-heading" data-baseline-check="flow" data-baseline-label="form atlas inline options heading">test</div>
        <div class="bf-inline-options-options" data-baseline-check="box" data-baseline-label="form atlas inline options list">
          <label class="bf-inline-options-option" data-baseline-check="box" data-baseline-label="form atlas inline option 1">
            <input type="radio" name="form-atlas-inline-options" checked data-baseline-ignore="true">
            <span>test</span>
          </label>
          <label class="bf-inline-options-option" data-baseline-check="box" data-baseline-label="form atlas inline option 2">
            <input type="radio" name="form-atlas-inline-options" data-baseline-ignore="true">
            <span>alpha</span>
          </label>
          <label class="bf-inline-options-option" data-baseline-check="box" data-baseline-label="form atlas inline option 3">
            <input type="radio" name="form-atlas-inline-options" data-baseline-ignore="true">
            <span>omega</span>
          </label>
        </div>
      </div>
    </section>

    <section class="bf-section is-shallow bf-cluster" data-baseline-check="box" data-baseline-label="form atlas field row">
      <div class="bf-inline-size is-compact bf-stack is-flush">
        <p class="bf-body" data-baseline-check="flow" data-baseline-label="form atlas field reference">test</p>
      </div>

      <div class="bf-field is-range bf-inline-size is-medium" data-baseline-check="box" data-baseline-label="form atlas range field">
        <label class="bf-form-label" for="form-atlas-range" data-baseline-check="flow" data-baseline-label="form atlas range label">test</label>
        <div class="bf-control" data-baseline-check="box" data-baseline-label="form atlas range control">
          <div class="bf-slider" data-baseline-check="box" data-baseline-label="form atlas range wrapper">
            <input id="form-atlas-range" type="range" min="0" max="100" value="64" data-baseline-ignore="true" data-baseline-label="form atlas range input">
            <input class="bf-slider-input" type="number" min="0" max="100" value="64" data-baseline-check="box" data-baseline-label="form atlas range number input">
          </div>
        </div>
      </div>

      <div class="bf-field is-range is-stacked bf-inline-size is-medium" data-baseline-check="box" data-baseline-label="form atlas stacked range field">
        <label class="bf-form-label" for="form-atlas-range-stacked" data-baseline-check="flow" data-baseline-label="form atlas stacked range label">test</label>
        <div class="bf-control" data-baseline-check="box" data-baseline-label="form atlas stacked range control">
          <div class="bf-slider" data-baseline-check="box" data-baseline-label="form atlas stacked range wrapper">
            <input id="form-atlas-range-stacked" type="range" min="0" max="100" value="64" data-baseline-ignore="true" data-baseline-label="form atlas stacked range input">
            <input class="bf-slider-input" type="number" min="0" max="100" value="64" data-baseline-check="box" data-baseline-label="form atlas stacked range number input">
          </div>
        </div>
      </div>

      <div class="bf-field bf-inline-size is-regular" data-baseline-check="box" data-baseline-label="form atlas file input field">
        <label class="bf-form-label" for="form-atlas-file-input" data-baseline-check="flow" data-baseline-label="form atlas file input label">test</label>
        <div class="bf-control" data-baseline-check="box" data-baseline-label="form atlas file input control">
          <input id="form-atlas-file-input" type="file" data-baseline-check="box" data-baseline-label="form atlas file input">
        </div>
        <p class="bf-form-help" data-baseline-check="flow" data-baseline-label="form atlas file input help">test</p>
      </div>

      <div class="bf-field is-success bf-inline-size is-wide" data-baseline-check="box" data-baseline-label="form atlas validation field">
        <label class="bf-form-label" for="form-atlas-validation" data-baseline-check="flow" data-baseline-label="form atlas validation label">test</label>
        <div class="bf-control" data-baseline-check="box" data-baseline-label="form atlas validation control">
          <input id="form-atlas-validation" class="bf-input" type="text" value="test" data-baseline-check="box" data-baseline-label="form atlas validation input">
        </div>
        <p class="bf-validation-message" data-baseline-check="flow" data-baseline-label="form atlas validation message">test</p>
      </div>
    </section>

    <section class="bf-section is-shallow bf-cluster" data-baseline-ignore="true">
      <div class="bf-inline-size is-compact bf-stack is-flush">
        <p class="bf-body">test</p>
      </div>

      <div class="bf-inline-size is-x-wide">
        <table class="bf-table">
          <caption class="bf-table-caption">Current export jobs</caption>
          <thead>
            <tr>
              <th>Job</th>
              <th>Status</th>
              <th>Updated</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td>Summit opener</td>
              <td>Saved</td>
              <td>2m ago</td>
            </tr>
            <tr>
              <td>Landscape slate</td>
              <td>Review</td>
              <td>9m ago</td>
            </tr>
          </tbody>
        </table>
      </div>
    </section>
  </main>

  <script type="module" src="../component-demo.js"></script>
</body>
</html>
