<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Range Demo</title>
  <link rel="stylesheet" href="../../dist/presets/panel/styles.css?v=20260328-panel-refresh-11">
  <link rel="stylesheet" href="../component-shell.css?v=20260328-panel-refresh-11">
</head>
<body>
  <main class="component-demo-page component-demo-page--panel vr-theme" data-bf-tone="dark">
    <header class="component-demo-header">
      <div>
        <h5 class="bf-h5 component-demo-kicker">Range</h5>
        <h1>Slider pair</h1>
        <p class="component-demo-meta">Range input and numeric pair on the compact preset, including the fixed visual thumb size.</p>
      </div>
      <div class="component-demo-toolbar">
        <label class="component-demo-toggle" for="baseline-grid-toggle">
          <input id="baseline-grid-toggle" class="js-baseline-toggle" type="checkbox" aria-controls="component-grid-target">
          Show baseline grid
        </label>
      </div>
    </header>

    <section class="component-demo-stage component-demo-stack" id="component-grid-target" data-component-capture>
      <section class="component-demo-surface component-demo-flow-box" data-baseline-check="box" data-baseline-label="range section">
        <div class="p-form__group" data-baseline-check="box" data-baseline-label="range field">
          <label class="p-form__label u-no-margin--bottom" for="range-demo" data-baseline-check="flow" data-baseline-label="range label">Grid density</label>
          <div class="p-form__control" data-baseline-check="box" data-baseline-label="range control">
            <div class="p-slider__wrapper p-slider__wrapper--stacked" data-baseline-check="box" data-baseline-label="range wrapper">
              <input id="range-demo" type="range" min="0" max="100" value="64" data-baseline-check="box" data-baseline-label="range input">
              <input class="p-slider__input" type="number" min="0" max="100" value="64" data-baseline-check="box" data-baseline-label="range number input">
            </div>
          </div>
        </div>
      </section>
    </section>
  </main>

  <script type="module" src="../component-demo.js?v=20260328-panel-refresh-11"></script>
</body>
</html>
