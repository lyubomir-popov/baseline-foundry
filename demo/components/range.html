<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Range Demo</title>
  <link rel="stylesheet" href="../../dist/presets/panel/styles.css">
  <link rel="stylesheet" href="../component-shell.css">
</head>
<body class="bf-theme" data-bf-tone="dark" data-component-capture>
<section class="bf-stack" data-baseline-check="box" data-baseline-label="range section">
 <div class="bf-field" data-baseline-check="box" data-baseline-label="range field">
 <label class="bf-form-label" for="range-demo" data-baseline-check="flow" data-baseline-label="range label">Grid density</label>
 <div class="bf-control" data-baseline-check="box" data-baseline-label="range control">
 <div class="bf-slider is-stacked" data-baseline-check="box" data-baseline-label="range wrapper">
 <input id="range-demo" type="range" min="0" max="100" value="64" data-baseline-check="box" data-baseline-label="range input">
 <input class="bf-slider-input" type="number" min="0" max="100" value="64" data-baseline-check="box" data-baseline-label="range number input">
 </div>
 </div>
 </div>
 </section>
  <script type="module" src="../component-demo.js"></script>
</body>
</html>
