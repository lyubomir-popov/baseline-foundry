<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>List Tree Demo</title>
  <link rel="stylesheet" href="../../dist/presets/panel/styles.css?v=20260329-panel-refresh-19">
  <link rel="stylesheet" href="../component-shell.css?v=20260329-panel-refresh-19">
</head>
<body>
  <main class="component-demo-page component-demo-page--panel vr-theme" data-bf-tone="dark">
    <header class="component-demo-header">
      <div>
        <h5 class="bf-h5 component-demo-kicker">List Tree</h5>
        <h1>Dense nested navigation tree</h1>
        <p class="component-demo-meta">The list tree keeps the compact body scale while exposing nested navigation without leaving the baseline grid.</p>
      </div>
      <div class="component-demo-toolbar">
        <label class="component-demo-toggle" for="baseline-grid-toggle">
          <input id="baseline-grid-toggle" class="js-baseline-toggle" type="checkbox" aria-controls="component-grid-target">
          Show baseline grid
        </label>
      </div>
    </header>

    <section class="component-demo-stage component-demo-stack" id="component-grid-target" data-component-capture>
      <section class="component-demo-surface component-demo-flow-box" data-baseline-ignore="true">
        <ul class="bf-list-tree" data-baseline-check="box" data-baseline-label="list tree root">
          <li class="bf-list-tree-item" aria-expanded="true" data-baseline-check="box" data-baseline-label="list tree parent item">
            <button class="bf-list-tree-toggle" type="button" aria-expanded="true" aria-controls="list-tree-layouts" data-baseline-check="box" data-baseline-label="list tree toggle">Layouts</button>
            <ul id="list-tree-layouts" class="bf-list-tree" aria-hidden="false" data-baseline-check="box" data-baseline-label="list tree nested">
              <li class="bf-list-tree-item" data-baseline-check="box" data-baseline-label="list tree child one">
                <a class="bf-list-tree-link is-active" href="#" data-baseline-check="box" data-baseline-label="list tree link one">Hero panels</a>
              </li>
              <li class="bf-list-tree-item" data-baseline-check="box" data-baseline-label="list tree child two">
                <a class="bf-list-tree-link" href="#" data-baseline-check="box" data-baseline-label="list tree link two">Editorial strips</a>
              </li>
            </ul>
          </li>
          <li class="bf-list-tree-item" data-baseline-check="box" data-baseline-label="list tree standalone item">
            <a class="bf-list-tree-link" href="#" data-baseline-check="box" data-baseline-label="list tree standalone link">Export presets</a>
          </li>
        </ul>
      </section>
    </section>
  </main>

  <script type="module" src="../component-demo.js?v=20260329-panel-refresh-19"></script>
</body>
</html>
