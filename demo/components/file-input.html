<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>File Input Demo</title>
  <link rel="stylesheet" href="../../dist/presets/panel/styles.css?v=20260328-panel-refresh-18">
  <link rel="stylesheet" href="../component-shell.css?v=20260328-panel-refresh-18">
</head>
<body>
  <main class="component-demo-page component-demo-page--panel vr-theme" data-bf-tone="dark">
    <header class="component-demo-header">
      <div>
        <h5 class="bf-h5 component-demo-kicker">File Input</h5>
        <h1>Dense file field</h1>
        <p class="component-demo-meta">File inputs now use the same dense field sizing and bottom-border treatment as the other panel fields.</p>
      </div>
      <div class="component-demo-toolbar">
        <label class="component-demo-toggle" for="baseline-grid-toggle">
          <input id="baseline-grid-toggle" class="js-baseline-toggle" type="checkbox" aria-controls="component-grid-target">
          Show baseline grid
        </label>
      </div>
    </header>

    <section class="component-demo-stage component-demo-stack" id="component-grid-target" data-component-capture>
      <section class="component-demo-surface component-demo-flow-box" data-baseline-check="box" data-baseline-label="file input section">
        <div class="p-form__group" data-baseline-check="box" data-baseline-label="file input field">
          <label class="p-form__label u-no-margin--bottom" for="file-input-demo" data-baseline-check="flow" data-baseline-label="file input label">Source asset</label>
          <div class="p-form__control" data-baseline-check="box" data-baseline-label="file input control">
            <input id="file-input-demo" type="file" data-baseline-check="box" data-baseline-label="file input input">
          </div>
          <p class="p-form-help-text u-no-margin--bottom" data-baseline-check="flow" data-baseline-label="file input help">The selector button and field row both use the same dense token set.</p>
        </div>
      </section>
    </section>
  </main>

  <script type="module" src="../component-demo.js?v=20260328-panel-refresh-18"></script>
</body>
</html>
