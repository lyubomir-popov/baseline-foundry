<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>File Input Demo</title>
  <link rel="stylesheet" href="../../dist/presets/panel/styles.css">
  <link rel="stylesheet" href="../component-shell.css">
</head>
<body class="bf-theme is-dark" data-component-capture>
<section class="bf-stack" data-baseline-check="box" data-baseline-label="file input section">
 <div class="bf-field" data-baseline-check="box" data-baseline-label="file input field">
 <label class="bf-form-label" for="file-input-demo" data-baseline-check="flow" data-baseline-label="file input label">Source asset</label>
 <div class="bf-control" data-baseline-check="box" data-baseline-label="file input control">
 <input id="file-input-demo" type="file" data-baseline-check="box" data-baseline-label="file input input">
 </div>
 <p class="bf-form-help" data-baseline-check="flow" data-baseline-label="file input help">The selector button and field row both use the same dense token set.</p>
 </div>
 </section>
  <script type="module" src="../component-demo.js"></script>
</body>
</html>
