<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Table Demo</title>
  <link rel="stylesheet" href="../../dist/tiers/editorial/styles.css">
  <link rel="stylesheet" href="../component-shell.css">
</head>
<body class="bf-theme is-dark" data-component-capture>
<section class="bf-stack" data-baseline-ignore="true">
 <table class="bf-table">
 <caption class="bf-table-caption" data-baseline-ignore="true">Current export jobs</caption>
 <thead data-baseline-ignore="true">
 <tr data-baseline-ignore="true">
 <th data-baseline-check="box" data-baseline-label="table heading 1">Job</th>
 <th data-baseline-check="box" data-baseline-label="table heading 2">Status</th>
 <th data-baseline-check="box" data-baseline-label="table heading 3">Updated</th>
 </tr>
 </thead>
 <tbody data-baseline-ignore="true">
 <tr data-baseline-ignore="true">
 <td data-baseline-check="box" data-baseline-label="table row 1 col 1">Summit opener</td>
 <td class="is-icon-placeholder" data-baseline-check="box" data-baseline-label="table row 1 col 2"><span class="bf-icon is-success-grey" aria-hidden="true"></span>Saved</td>
 <td data-baseline-check="box" data-baseline-label="table row 1 col 3">2m ago</td>
 </tr>
 <tr data-baseline-ignore="true">
 <td data-baseline-check="box" data-baseline-label="table row 2 col 1">Landscape slate</td>
 <td class="is-icon-placeholder" data-baseline-check="box" data-baseline-label="table row 2 col 2"><span class="bf-icon is-error-grey" aria-hidden="true"></span>Blocked</td>
 <td data-baseline-check="box" data-baseline-label="table row 2 col 3">9m ago</td>
 </tr>
 </tbody>
 </table>
 </section>
  <script type="module" src="../component-demo.js"></script>
</body>
</html>
