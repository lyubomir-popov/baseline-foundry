<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Table Demo</title>
  <link rel="stylesheet" href="../../dist/presets/panel/styles.css">
  <link rel="stylesheet" href="../component-shell.css">
</head>
<body class="vr-theme" data-bf-tone="dark" data-component-capture>
<section class="bf-stack" data-baseline-ignore="true">
 <table class="bf-table">
 <caption class="bf-table-caption" data-baseline-ignore="true">Current export jobs</caption>
 <thead data-baseline-ignore="true">
 <tr data-baseline-ignore="true">
 <th data-baseline-ignore="true"><span style="display:block;line-height:inherit;margin:0" data-baseline-check="flow" data-baseline-label="table heading 1">Job</span></th>
 <th data-baseline-ignore="true"><span style="display:block;line-height:inherit;margin:0" data-baseline-check="flow" data-baseline-label="table heading 2">Status</span></th>
 <th data-baseline-ignore="true"><span style="display:block;line-height:inherit;margin:0" data-baseline-check="flow" data-baseline-label="table heading 3">Updated</span></th>
 </tr>
 </thead>
 <tbody data-baseline-ignore="true">
 <tr data-baseline-ignore="true">
 <td data-baseline-ignore="true"><span style="display:block;line-height:inherit;margin:0" data-baseline-check="flow" data-baseline-label="table row 1 col 1">Summit opener</span></td>
 <td data-baseline-ignore="true"><span style="display:block;line-height:inherit;margin:0" data-baseline-check="flow" data-baseline-label="table row 1 col 2">Saved</span></td>
 <td data-baseline-ignore="true"><span style="display:block;line-height:inherit;margin:0" data-baseline-check="flow" data-baseline-label="table row 1 col 3">2m ago</span></td>
 </tr>
 <tr data-baseline-ignore="true">
 <td data-baseline-ignore="true"><span style="display:block;line-height:inherit;margin:0" data-baseline-check="flow" data-baseline-label="table row 2 col 1">Landscape slate</span></td>
 <td data-baseline-ignore="true"><span style="display:block;line-height:inherit;margin:0" data-baseline-check="flow" data-baseline-label="table row 2 col 2">Review</span></td>
 <td data-baseline-ignore="true"><span style="display:block;line-height:inherit;margin:0" data-baseline-check="flow" data-baseline-label="table row 2 col 3">9m ago</span></td>
 </tr>
 </tbody>
 </table>
 </section>
  <script type="module" src="../component-demo.js"></script>
</body>
</html>
