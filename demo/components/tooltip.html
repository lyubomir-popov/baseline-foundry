<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tooltip Demo</title>
  <link rel="stylesheet" href="../../dist/presets/panel/styles.css?v=20260329-panel-refresh-19">
  <link rel="stylesheet" href="../component-shell.css?v=20260329-panel-refresh-19">
</head>
<body>
  <main class="component-demo-page component-demo-page--panel vr-theme" data-bf-tone="dark">
    <header class="component-demo-header">
      <div>
        <h5 class="bf-h5 component-demo-kicker">Tooltip</h5>
        <h1>Detached tooltip surface</h1>
        <p class="component-demo-meta">Detached tooltips stay visible for inspection here, while the runtime module still handles hover and focus for the attached version.</p>
      </div>
      <div class="component-demo-toolbar">
        <label class="component-demo-toggle" for="baseline-grid-toggle">
          <input id="baseline-grid-toggle" class="js-baseline-toggle" type="checkbox" aria-controls="component-grid-target">
          Show baseline grid
        </label>
      </div>
    </header>

    <section class="component-demo-stage component-demo-stack" id="component-grid-target" data-component-capture>
      <section class="component-demo-surface component-demo-flow-box" data-baseline-ignore="true">
        <div class="bf-tooltip is-detached" data-baseline-ignore="true">
          <button class="bf-button is-base is-dense" type="button" data-baseline-check="box" data-baseline-label="tooltip trigger">Aspect ratio help</button>
          <p class="bf-tooltip-message" aria-hidden="false" data-baseline-check="box" data-baseline-label="tooltip message">Ratios lock the stage while export presets inherit the final canvas size.</p>
        </div>
      </section>
    </section>
  </main>

  <script type="module" src="../component-demo.js?v=20260329-panel-refresh-19"></script>
</body>
</html>
