<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Choice Row Demo</title>
  <link rel="stylesheet" href="../../dist/presets/panel/styles.css">
  <link rel="stylesheet" href="../component-shell.css">
</head>
<body class="bf-theme" data-bf-tone="dark" data-component-capture>
<section class="bf-stack" data-baseline-check="box" data-baseline-label="choice row section">
 <div class="bf-choice-list" data-baseline-check="box" data-baseline-label="choice row list">
 <label class="bf-choice-row" data-baseline-check="box" data-baseline-label="choice row 1">
 <input type="radio" name="choice-row-canonical" checked data-baseline-ignore="true">
 <span class="bf-choice-row-name">Landscape 1280x720</span>
 <span class="bf-choice-row-meta">Active</span>
 </label>
 <label class="bf-choice-row" data-baseline-check="box" data-baseline-label="choice row 2">
 <input type="radio" name="choice-row-canonical" data-baseline-ignore="true">
 <span class="bf-choice-row-name">Portrait 1080x1920</span>
 <span class="bf-choice-row-meta">Secondary</span>
 </label>
 <label class="bf-choice-row" data-baseline-check="box" data-baseline-label="choice row 3">
 <input type="radio" name="choice-row-canonical" data-baseline-ignore="true">
 <span class="bf-choice-row-name">Square 1080x1080</span>
 <span class="bf-choice-row-meta">Available</span>
 </label>
 </div>
 </section>
  <script type="module" src="../component-demo.js"></script>
</body>
</html>
