<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Switch Demo</title>
  <link rel="stylesheet" href="../../dist/presets/panel/styles.css">
  <link rel="stylesheet" href="../component-shell.css">
</head>
<body class="bf-theme" data-bf-tone="dark" data-component-capture>
<section class="bf-stack" data-baseline-check="box" data-baseline-label="switch section">
 <label class="bf-switch" data-baseline-check="box" data-baseline-label="switch component">
 <input class="bf-switch-input" type="checkbox" checked data-baseline-ignore="true">
 <span class="bf-switch-slider" aria-hidden="true"></span>
 <span class="bf-switch-label" data-baseline-check="flow" data-baseline-label="switch label">Enable export safe area guides</span>
 </label>
 </section>
  <script type="module" src="../component-demo.js"></script>
</body>
</html>
