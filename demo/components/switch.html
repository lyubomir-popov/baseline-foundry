<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Switch Demo</title>
  <link rel="stylesheet" href="../../dist/presets/panel/styles.css?v=20260328-panel-refresh-18">
  <link rel="stylesheet" href="../component-shell.css?v=20260328-panel-refresh-18">
</head>
<body>
  <main class="component-demo-page component-demo-page--panel vr-theme" data-bf-tone="dark">
    <header class="component-demo-header">
      <div>
        <h5 class="bf-h5 component-demo-kicker">Switch</h5>
        <h1>Dense switch control</h1>
        <p class="component-demo-meta">Switch track, thumb, and label all sit on the same compact panel rhythm.</p>
      </div>
      <div class="component-demo-toolbar">
        <label class="component-demo-toggle" for="baseline-grid-toggle">
          <input id="baseline-grid-toggle" class="js-baseline-toggle" type="checkbox" aria-controls="component-grid-target">
          Show baseline grid
        </label>
      </div>
    </header>

    <section class="component-demo-stage component-demo-stack" id="component-grid-target" data-component-capture>
      <section class="component-demo-surface component-demo-flow-box" data-baseline-check="box" data-baseline-label="switch section">
        <label class="p-switch" data-baseline-check="box" data-baseline-label="switch component">
          <input class="p-switch__input" type="checkbox" checked data-baseline-ignore="true">
          <span class="p-switch__slider" aria-hidden="true" data-baseline-check="box" data-baseline-label="switch slider"></span>
          <span class="p-switch__label" data-baseline-check="flow" data-baseline-label="switch label">Enable export safe area guides</span>
        </label>
      </section>
    </section>
  </main>

  <script type="module" src="../component-demo.js?v=20260328-panel-refresh-18"></script>
</body>
</html>
