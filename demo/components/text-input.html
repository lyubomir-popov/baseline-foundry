<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Text Input Demo</title>
  <link rel="stylesheet" href="../../dist/presets/panel/styles.css?v=20260328-panel-refresh-14">
  <link rel="stylesheet" href="../component-shell.css?v=20260328-panel-refresh-14">
</head>
<body>
  <main class="component-demo-page component-demo-page--panel vr-theme" data-bf-tone="dark">
    <header class="component-demo-header">
      <div>
        <h5 class="bf-h5 component-demo-kicker">Text Input</h5>
        <h1>Dense text field</h1>
        <p class="component-demo-meta">Bottom-border text field sizing, label rhythm, and help text on the compact panel preset.</p>
      </div>
      <div class="component-demo-toolbar">
        <label class="component-demo-toggle" for="baseline-grid-toggle">
          <input id="baseline-grid-toggle" class="js-baseline-toggle" type="checkbox" aria-controls="component-grid-target">
          Show baseline grid
        </label>
      </div>
    </header>

    <section class="component-demo-stage component-demo-stack" id="component-grid-target" data-component-capture>
      <section class="component-demo-surface component-demo-flow-box" data-baseline-check="box" data-baseline-label="text input section">
        <div class="p-form__group" data-baseline-check="box" data-baseline-label="text input field">
          <label class="p-form__label u-no-margin--bottom" for="text-input-demo" data-baseline-check="flow" data-baseline-label="text input label">Title</label>
          <div class="p-form__control" data-baseline-check="box" data-baseline-label="text input control">
            <input id="text-input-demo" class="p-form-validation__input is-dense" type="text" value="Ubuntu Summit" data-baseline-check="box" data-baseline-label="text input input">
          </div>
          <p class="p-form-help-text u-no-margin--bottom" data-baseline-check="flow" data-baseline-label="text input help">Compact control rows still leave one full baseline unit of breathing room.</p>
        </div>

        <div class="p-form__group" data-baseline-check="box" data-baseline-label="text input tight help field">
          <label class="p-form__label u-no-margin--bottom" for="text-input-tight-demo" data-baseline-check="flow" data-baseline-label="text input tight help label">Document Alias</label>
          <div class="p-form__control" data-baseline-check="box" data-baseline-label="text input tight help control">
            <input id="text-input-tight-demo" class="p-form-validation__input is-dense" type="text" value="summit-lockup-title" data-baseline-check="box" data-baseline-label="text input tight help input">
          </div>
          <p class="p-form-help-text is-tight control-help u-no-margin--bottom" data-baseline-check="flow" data-baseline-label="text input tight help">Tight helper text now resolves through the package.</p>
        </div>
      </section>
    </section>
  </main>

  <script type="module" src="../component-demo.js?v=20260328-panel-refresh-14"></script>
</body>
</html>
