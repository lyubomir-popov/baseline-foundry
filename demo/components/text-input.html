<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Text Input Demo</title>
  <link rel="stylesheet" href="../../dist/presets/panel/styles.css">
  <link rel="stylesheet" href="../component-shell.css">
</head>
<body class="vr-theme" data-bf-tone="dark" data-component-capture>
<section class="bf-stack" data-baseline-check="box" data-baseline-label="text input section">
 <div class="bf-field" data-baseline-check="box" data-baseline-label="text input field">
 <label class="bf-form-label" for="text-input-demo" data-baseline-check="flow" data-baseline-label="text input label">Title</label>
 <div class="bf-control" data-baseline-check="box" data-baseline-label="text input control">
 <input id="text-input-demo" class="bf-input is-dense" type="text" value="Ubuntu Summit" data-baseline-check="box" data-baseline-label="text input input">
 </div>
 <p class="bf-form-help" data-baseline-check="flow" data-baseline-label="text input help">Compact control rows still leave one full baseline unit of breathing room.</p>
 </div>

 <div class="bf-field" data-baseline-check="box" data-baseline-label="text input tight help field">
 <label class="bf-form-label" for="text-input-tight-demo" data-baseline-check="flow" data-baseline-label="text input tight help label">Document Alias</label>
 <div class="bf-control" data-baseline-check="box" data-baseline-label="text input tight help control">
 <input id="text-input-tight-demo" class="bf-input is-dense" type="text" value="summit-lockup-title" data-baseline-check="box" data-baseline-label="text input tight help input">
 </div>
 <p class="bf-form-help is-tight" data-baseline-check="flow" data-baseline-label="text input tight help">Tight helper text now resolves through the package.</p>
 </div>
 </section>
  <script type="module" src="../component-demo.js"></script>
</body>
</html>
