<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Button Demo</title>
  <link rel="stylesheet" href="../../dist/tiers/editorial/styles.css">
  <link rel="stylesheet" href="../component-shell.css">
</head>
<body class="bf-theme is-dark" data-component-capture>
<section class="bf-stack" data-baseline-check="box" data-baseline-label="button section">
 <h5 class="bf-h5" data-baseline-check="flow" data-baseline-label="button kicker">Actions</h5>
 <div style="align-items:flex-start;display:flex;flex-direction:column" data-baseline-check="box" data-baseline-label="button stack">
 <button class="bf-button" type="button" data-baseline-check="flow" data-baseline-label="button stacked 1">Apply</button>
 <button class="bf-button" type="button" data-baseline-check="flow" data-baseline-label="button stacked 2">Reset</button>
 <button class="bf-button" type="button" data-baseline-check="flow" data-baseline-label="button stacked 3">Export</button>
 </div>
 </section>
 <section class="bf-stack" data-baseline-check="box" data-baseline-label="positive button section">
 <h5 class="bf-h5" data-baseline-check="flow" data-baseline-label="positive button kicker">Positive</h5>
 <div style="align-items:flex-start;display:flex;flex-direction:column" data-baseline-check="box" data-baseline-label="positive button stack">
 <button class="bf-button is-positive" type="button" data-baseline-check="flow" data-baseline-label="positive button stacked 1">Submit</button>
 <button class="bf-button is-positive" type="button" data-baseline-check="flow" data-baseline-label="positive button stacked 2">Confirm</button>
 </div>
 </section>
  <script type="module" src="../component-demo.js"></script>
</body>
</html>
