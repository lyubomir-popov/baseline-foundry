<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Button Demo</title>
  <link rel="stylesheet" href="../../dist/presets/panel/styles.css">
  <link rel="stylesheet" href="../component-shell.css">
</head>
<body class="bf-theme is-dark" data-component-capture>
<section class="bf-stack" data-baseline-check="box" data-baseline-label="button section">
 <h5 class="bf-h5" data-baseline-check="flow" data-baseline-label="button kicker">Actions</h5>
 <div class="bf-cluster" data-baseline-check="box" data-baseline-label="button row">
 <button class="bf-button is-dense" type="button" data-baseline-check="box" data-baseline-label="button primary">Apply</button>
 <button class="bf-button is-base is-dense" type="button" data-baseline-check="box" data-baseline-label="button base">Reset</button>
 </div>
 </section>
  <script type="module" src="../component-demo.js"></script>
</body>
</html>
