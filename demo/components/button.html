<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Button Demo</title>
  <link rel="stylesheet" href="../../dist/presets/panel/styles.css?v=20260328-panel-refresh-5">
  <link rel="stylesheet" href="../component-shell.css?v=20260328-panel-refresh-5">
</head>
<body>
  <main class="component-demo-page component-demo-page--panel vr-theme" data-bf-tone="dark">
    <header class="component-demo-header">
      <div>
        <h5 class="bf-h5 component-demo-kicker">Button</h5>
        <h1>Dense panel buttons</h1>
        <p class="component-demo-meta">Primary and base buttons on the compact panel preset, sized from the preset tokens rather than one-off demo CSS.</p>
      </div>
      <div class="component-demo-toolbar">
        <label class="component-demo-toggle" for="baseline-grid-toggle">
          <input id="baseline-grid-toggle" class="js-baseline-toggle" type="checkbox" aria-controls="component-grid-target">
          Show baseline grid
        </label>
      </div>
    </header>

    <section class="component-demo-stage component-demo-stack" id="component-grid-target" data-component-capture>
      <section class="component-demo-surface component-demo-flow-box" data-baseline-check="box" data-baseline-label="button section">
        <h5 class="bf-h5 component-demo-kicker" data-baseline-check="flow" data-baseline-label="button kicker">Actions</h5>
        <div class="component-demo-cluster" data-baseline-check="box" data-baseline-label="button row">
          <button class="p-button is-dense" type="button" data-baseline-check="box" data-baseline-label="button primary">Apply</button>
          <button class="p-button--base is-dense" type="button" data-baseline-check="box" data-baseline-label="button base">Reset</button>
        </div>
      </section>
    </section>
  </main>

  <script type="module" src="../component-demo.js?v=20260328-panel-refresh-5"></script>
</body>
</html>
