<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Button Demo</title>
  <link rel="stylesheet" href="../../dist/tiers/editorial/styles.css">
  <link rel="stylesheet" href="../component-shell.css">
</head>
<body class="bf-theme is-dark" data-component-capture>
<section class="bf-stack" data-baseline-check="box" data-baseline-label="button section">
 <h5 class="bf-h5" data-baseline-check="flow" data-baseline-label="button kicker">Actions</h5>
 <div style="align-items:flex-start;display:flex;flex-direction:column" data-baseline-check="box" data-baseline-label="button stack">
 <button class="bf-button" type="button" data-baseline-check="flow" data-baseline-label="button stacked 1">Apply</button>
 <button class="bf-button" type="button" data-baseline-check="flow" data-baseline-label="button stacked 2">Reset</button>
 <button class="bf-button" type="button" data-baseline-check="flow" data-baseline-label="button stacked 3">Export</button>
 </div>
 </section>
 <section class="bf-stack" data-baseline-check="box" data-baseline-label="positive button section">
 <h5 class="bf-h5" data-baseline-check="flow" data-baseline-label="positive button kicker">Positive</h5>
 <div style="align-items:flex-start;display:flex;flex-direction:column" data-baseline-check="box" data-baseline-label="positive button stack">
 <button class="bf-button is-positive" type="button" data-baseline-check="flow" data-baseline-label="positive button stacked 1">Submit</button>
 <button class="bf-button is-positive" type="button" data-baseline-check="flow" data-baseline-label="positive button stacked 2">Confirm</button>
 </div>
 </section>
 <section class="bf-stack" data-baseline-check="box" data-baseline-label="negative button section">
 <h5 class="bf-h5" data-baseline-check="flow" data-baseline-label="negative button kicker">Negative</h5>
 <div style="align-items:flex-start;display:flex;flex-direction:column" data-baseline-check="box" data-baseline-label="negative button stack">
 <button class="bf-button is-negative" type="button" data-baseline-check="flow" data-baseline-label="negative button stacked 1">Delete</button>
 <button class="bf-button is-negative" type="button" data-baseline-check="flow" data-baseline-label="negative button stacked 2">Remove</button>
 </div>
 </section>
 <section class="bf-stack" data-baseline-check="box" data-baseline-label="link button section">
 <h5 class="bf-h5" data-baseline-check="flow" data-baseline-label="link button kicker">Link</h5>
 <div style="align-items:flex-start;display:grid;gap:var(--bf-space-1)" data-baseline-check="box" data-baseline-label="link button stack">
 <button class="bf-button is-link" type="button" data-baseline-check="flow" data-baseline-label="link button stacked 1">View details</button>
 <button class="bf-button is-link" type="button" data-baseline-check="flow" data-baseline-label="link button stacked 2">Read the docs</button>
 </div>
 </section>
 <section class="bf-stack" data-baseline-check="box" data-baseline-label="icon button section">
 <h5 class="bf-h5" data-baseline-check="flow" data-baseline-label="icon button kicker">Icon</h5>
 <div style="align-items:flex-start;display:grid;gap:var(--bf-space-1)" data-baseline-check="box" data-baseline-label="icon button stack">
 <button class="bf-button is-icon" type="button" data-baseline-check="flow" data-baseline-label="icon button stacked 1"><span class="bf-icon is-search" aria-hidden="true"></span><span class="bf-button-label">Search</span></button>
 <button class="bf-button is-icon is-positive" type="button" data-baseline-check="flow" data-baseline-label="icon button stacked 2"><span class="bf-button-label">Continue</span><span class="bf-icon is-chevron-right" aria-hidden="true"></span></button>
 <button class="bf-button is-icon" type="button" aria-label="Search" data-block-derived-icon-button data-baseline-check="box" data-baseline-label="icon-only button stacked 1"><span class="bf-icon is-search" aria-hidden="true"></span></button>
 <button class="bf-button is-icon is-negative" type="button" aria-label="Close" data-block-derived-icon-button data-baseline-check="box" data-baseline-label="icon-only button stacked 2"><span class="bf-icon is-close" aria-hidden="true"></span></button>
 <button class="bf-button is-link is-icon" type="button" aria-label="Open help" data-block-derived-icon-button="link" data-baseline-check="box" data-baseline-label="icon-only link button"><span class="bf-icon is-search" aria-hidden="true"></span></button>
 </div>
 </section>
  <script type="module" src="../component-demo.js"></script>
</body>
</html>
