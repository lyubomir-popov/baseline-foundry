<!doctype html>
<html lang="en" data-spec-root="../../..">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Control block spacing bucket · Baseline Foundry</title>
    <link id="spec-tier-stylesheet" rel="stylesheet" href="../../../dist/tiers/editorial/styles.css" />
    <link rel="stylesheet" href="../../spec-shell.css" />
    <style>
      .bucket-page { max-inline-size: none; }
      .bucket-intro { max-inline-size: 68ch; }
      .bucket-row { border-block-start: 0.0625rem solid var(--bf-color-border-neutral); padding-block: var(--bf-space-2); }
      .bucket-row h2 { margin-block-end: var(--bf-space-1); }
      .bucket-track { display: flex; flex-wrap: nowrap; align-items: flex-start; gap: var(--bf-space-2); overflow-x: auto; padding: var(--bf-space-1); background: var(--bf-color-background-alt); }
      .bucket-sample { flex: 0 0 auto; inline-size: max-content; min-inline-size: 0; }
      .bucket-caption { display: block; max-inline-size: 100%; margin-block-start: var(--bf-space-1); font-size: .75rem; line-height: 1.2; font-weight: 400; overflow-wrap: anywhere; }
      .bucket-probe { position: relative; display: flow-root; inline-size: max-content; min-inline-size: 0; margin-block-start: var(--bucket-shift, 0rem); }
      .bucket-guide { position: absolute; z-index: 20; pointer-events: none; box-sizing: border-box; border-block: .125rem solid #d32229; inset-block-start: var(--guide-top); inset-inline-start: var(--guide-left); inline-size: var(--guide-width); block-size: var(--guide-height); }
      .bucket-guide::after { content: ""; position: absolute; inset-inline: 0; inset-block-start: var(--guide-baseline); border-block-start: .125rem solid #116bb8; }
      .bucket-guide.is-icon-only::after { content: none; }
      .bucket-probe > .bf-field-boundary { inline-size: var(--sample-width); }
      .bucket-probe .bf-pagination, .bucket-probe .bf-tabs, .bucket-probe .bf-segmented-control { inline-size: max-content; }
      .bucket-probe .bf-segmented-control-list { padding: 0; }
      .bucket-probe .bf-contextual-menu-dropdown { display: block; position: relative; inset: auto; inline-size: 8rem; min-inline-size: 0; }
      .bucket-probe .bf-top-navigation-dropdown { display: block; position: relative; inset: auto; inline-size: 8rem; min-inline-size: 0; }
      .bucket-probe .bf-top-navigation-dropdown-item { background: var(--bf-color-background-default); }
      .bucket-sample pre { display: none; }
      .bucket-key { font: 0.8rem/1.4 ui-monospace, monospace; }
      .bucket-key b { color: #c33; } .bucket-key i { color: #2379cb; font-style: normal; }
    </style>
  </head>
  <body class="bf-theme bf-tier-editorial" data-page-tier-options="editorial,documentation,app,os" data-page-baseline-default="on" data-page-section-label="Spacing bucket">
    <main class="bf-page is-fill bucket-page">
      <header class="bf-stack is-dense bucket-intro">
        <h1>01 · Control block</h1>
        <p>Standalone controls close individually. Tab strips and menu sets use equal row padding, touching paint, and one grid closure at the container end.</p>
        <p class="bucket-key"><b>Red</b> = visible box edges · <i>Blue</i> = estimated text baseline. Scroll sideways to compare every peer.</p>
      </header>
      <div id="bucket-rows"></div>
    </main>
    <script type="module" src="./01-control-block.js"></script>
  </body>
</html>
